  const hb3=document.getElementById('btn-hero-record'); if(hb3) hb3.addEventListener('click', openIncidentModal);
  const resetButton=document.getElementById('btn-reset-dashboard');
  if(resetButton) resetButton.addEventListener('click', async ()=>{
    if(saveTimer || saveInFlight){ toast('Wait for the current save', 'Try the reset again after synchronization finishes.', true); return; }
    const confirmation=prompt('This permanently clears every violation history and all comment/appeal records. Staff, workers, rules, thresholds, and accounts are preserved. Type RESET to continue.');
    if(confirmation!=='RESET') return;
    resetButton.disabled=true;
    try{
      const response=await fetch('/api/reset',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({confirmation})});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error || 'Unable to reset Dashboard records');
      await refreshSharedState(true, true);
      await refreshFeedback(true);
      toast('Dashboard records reset', `${result.clearedIncidents} violation record${result.clearedIncidents===1?'':'s'} and ${result.clearedFeedback} feedback record${result.clearedFeedback===1?'':'s'} cleared.`);
    }catch(error){ toast('Reset failed', error.message, true); resetButton.disabled=false; }
  });
  el.querySelectorAll('[data-view-case]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const found = findPerson(b.dataset.viewCase);
      if(found){ switchTab(found.group==='staff'?'staffs':'workers'); setTimeout(()=>openPersonModal(found.p.id, found.group), 30); }
    });
  });
}

/* ============ PEOPLE TABLES ============ */
function renderPeopleTable(group){
  const isStaff = group==='staff';
  const key = isStaff ? 'staffs' : 'workers';
  const list = state[key];
  const q = (state.search[key]||'').toLowerCase().trim();
  const filterVal = state.filter[key];

  let rows = list.filter(p=>{
    if(q){
      const hay = [p.employeeId,p.name,p.agent,p.division,p.designation].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(filterVal==='active-cases') return p.demeritPoints>0;
    if(filterVal==='clean') return p.demeritPoints===0;
    return true;
  });
  rows = rows.slice().sort((a,b)=> b.demeritPoints - a.demeritPoints || a.name.localeCompare(b.name));

  const el = document.getElementById('view-'+key);
  el.innerHTML = `
    <div class="table-wrap">
      <div class="table-toolbar">
        <select class="chip-select" id="filter-select">
          <option value="all" ${filterVal==='all'?'selected':''}>All ${key}</option>
          <option value="active-cases" ${filterVal==='active-cases'?'selected':''}>With active demerit</option>
          <option value="clean" ${filterVal==='clean'?'selected':''}>Clean record</option>
        </select>
        <div class="hint">${rows.length} of ${list.length} shown</div>
        <div class="spacer"></div>
        <div class="hint">Sorted by demerit points, highest first</div>
      </div>
      ${rows.length===0 ? `<div class="empty-state">${ICONS.search}<div>No records match your search.</div></div>` : `
      <div class="table-scroll-hint">Swipe left or right to see all columns</div>
      <div class="table-scroll table-scroll-people" tabindex="0" role="region" aria-label="${isStaff?'Staff':'Worker'} records">
        <table>
          <thead><tr>
            <th>Employee ID</th><th>Name</th><th>${isStaff?'Designation':'Designation / Shift'}</th><th>${isStaff?'Division':'Agent'}</th>
            <th>Status</th><th>Points</th><th>Action Taken</th><th style="text-align:right;">${isAdministrator()?'Manage':'View'}</th>
          </tr></thead>
          <tbody>
            ${rows.map(p=>`
              <tr>
                <td class="mono">${esc(p.employeeId)||'<span class="badge low">missing</span>'}</td>
                <td class="name-cell"><div class="n">${esc(p.name)}</div>${!isStaff?`<div class="d">${esc(p.passportNo||'no passport on file')}</div>`:''}</td>
                <td>${esc(p.designation)}${!isStaff?` <span class="hint">· Shift ${esc(p.shift||'—')}</span>`:''}</td>
                <td>${esc(isStaff ? p.division : p.agent)}</td>
                <td><span class="badge ${p.status==='Active'?'ok':'inactive'}">${esc(p.status||'Active')}</span></td>
                <td class="pts" style="color:${p.demeritPoints>=70?'var(--red)':p.demeritPoints>=41?'var(--orange)':p.demeritPoints>0?'var(--amber)':'var(--green)'}">${p.demeritPoints}<span class="hint" style="font-family:var(--body);"> / 100</span></td>
                <td style="max-width:180px;">${esc(p.action)}</td>
                <td>
                  <div class="row-actions">
                    ${isAdministrator()?`<button class="iconbtn" title="Edit record" aria-label="Edit ${esc(p.name)}" data-edit="${p.id}">${ICONS.edit}</button>
                    <button class="iconbtn del" title="Delete record" aria-label="Delete ${esc(p.name)}" data-del="${p.id}">${ICONS.trash}</button>`:`<button class="btn sm ghost" data-view-person="${p.id}">View</button>`}
                  </div>
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`}
    </div>
  `;
  document.getElementById('filter-select').addEventListener('change', (e)=>{ state.filter[key]=e.target.value; renderPeopleTable(group); });
  el.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> openPersonModal(b.dataset.edit, group)));
  el.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=> confirmDeletePerson(b.dataset.del, group)));
  el.querySelectorAll('[data-view-person]').forEach(b=> b.addEventListener('click', ()=> openPersonModal(b.dataset.viewPerson, group)));
}

/* ---------- Searchable offence selector ---------- */
function offencePickerControlsHtml(prefix){
  return `
    <div class="offence-picker-controls">
      <div class="field">
        <label for="${prefix}-search">Search Offence</label>
        <div class="offence-picker-search">${ICONS.search}<input id="${prefix}-search" type="search" autocomplete="off" placeholder="Name, description, ID or points…"/></div>
      </div>
      <div class="field">
        <label for="${prefix}-severity">Filter Severity</label>
        <select id="${prefix}-severity">
          <option value="all">All severities</option>
          <option value="Major Offence">Major</option>
          <option value="Minor Offence">Minor</option>
          <option value="Low Offence">Low</option>
        </select>
      </div>
    </div>`;
}

function setupOffencePicker(prefix, selectId, onSelectionChange){
  const searchInput = document.getElementById(prefix+'-search');
  const severitySelect = document.getElementById(prefix+'-severity');
  const ruleSelect = document.getElementById(selectId);
  const count = document.getElementById(prefix+'-count');
  if(!searchInput || !severitySelect || !ruleSelect || !count) return null;

  const renderOptions = ()=>{
    const query = searchInput.value.toLowerCase().trim();
    const severity = severitySelect.value;
    const previous = ruleSelect.value;
    const matches = state.offences
      .filter(rule=> severity==='all' || rule.severity===severity)
      .filter(rule=> !query || [rule.id,rule.offence,rule.reason,rule.severity,rule.points].join(' ').toLowerCase().includes(query))
      .sort((a,b)=> b.points-a.points || a.offence.localeCompare(b.offence));

    ruleSelect.innerHTML = `<option value="">${matches.length?'Select an offence rule…':'No offence rules match'}</option>`+
      matches.map(rule=>`<option value="${esc(rule.id)}">[${esc(rule.severity.replace(' Offence',''))}] ${esc(rule.offence)} — ${rule.points} pts</option>`).join('');
    ruleSelect.disabled = matches.length===0;
    if(matches.some(rule=>rule.id===previous)) ruleSelect.value = previous;
    count.textContent = `${matches.length} of ${state.offences.length} offence rules shown`;
    if(onSelectionChange) onSelectionChange();
  };

  searchInput.addEventListener('input', renderOptions);
  severitySelect.addEventListener('change', renderOptions);
  ruleSelect.addEventListener('change', ()=>{ if(onSelectionChange) onSelectionChange(); });
  renderOptions();
  return ruleSelect;
}

/* ---------- Dedicated incident recording ---------- */
function openIncidentModal(){
  if(!requireAdminAccess()) return;
  openModal(`
    <div class="modal-head">
      <h3>Record Incident</h3>
      <button class="btn ghost sm" id="modal-close" aria-label="Close">${ICONS.x}</button>
    </div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field">
          <label>Personnel Type</label>
          <select id="incident-group">
            <option value="staff">Staff</option>
            <option value="worker">Worker</option>
          </select>
        </div>
        <div class="field">
          <label for="incident-person-search">Search Name</label>
          <div class="offence-picker-search">${ICONS.search}<input id="incident-person-search" type="search" autocomplete="off" placeholder="Name, employee ID or division…"/></div>
        </div>
      </div>
      <div class="field">
        <label for="incident-person">Select Existing Person</label>
        <select id="incident-person" aria-label="Matching staff or worker records"></select>
        <div class="offence-picker-count" id="incident-person-count"></div>
      </div>

      <div class="incident-person-card" id="incident-person-card">
        <div class="field-row">
          <div class="field"><label>Employee ID</label><input id="incident-empid" readonly/></div>
          <div class="field"><label>Full Name</label><input id="incident-name" readonly/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Designation</label><input id="incident-designation" readonly/></div>
          <div class="field"><label>Division / Line</label><input id="incident-division" readonly/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Agent</label><input id="incident-agent" readonly/></div>
          <div class="field"><label>Status</label><input id="incident-status" readonly/></div>
        </div>
        <div class="field-row" id="incident-worker-details" style="display:none;">
          <div class="field"><label>Passport No.</label><input id="incident-passport" readonly/></div>
          <div class="field"><label>Shift</label><input id="incident-shift" readonly/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Current Demerit Points</label><input id="incident-current-points" readonly/></div>
          <div class="field"><label>Current Action</label><input id="incident-current-action" readonly/></div>
        </div>
      </div>

      <div class="field">
        <label>Date of Offence</label>
        <input id="incident-date" type="date" value="${todayISODate()}" max="${todayISODate()}"/>
      </div>
      <div class="field">
        <label>Offence Rule</label>
        ${offencePickerControlsHtml('incident-offence')}
        <select id="incident-rule" aria-label="Matching offence rules"></select>
        <div class="offence-picker-count" id="incident-offence-count"></div>
      </div>

      <div class="incident-projection" id="incident-projection"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btn-cancel">Cancel</button>
      <button class="btn primary" id="btn-record-incident" disabled>${ICONS.plus} Record Incident</button>
    </div>
  `, true);

  const groupSelect = document.getElementById('incident-group');
  const personSearch = document.getElementById('incident-person-search');
  const personSelect = document.getElementById('incident-person');
  const personCount = document.getElementById('incident-person-count');
  const ruleSelect = document.getElementById('incident-rule');
  const recordButton = document.getElementById('btn-record-incident');
  let selectedPerson = null;

  const groupRecords = ()=> groupSelect.value==='staff' ? state.staffs : state.workers;
  const selectedRule = ()=> state.offences.find(rule=>rule.id===ruleSelect.value) || null;

  function renderPersonOptions(){
    const allRecords = groupRecords();
    const query = personSearch.value.toLowerCase().trim();
    const previous = personSelect.value;
    const records = allRecords
      .filter(person=>!query || [person.name,person.employeeId,person.division,person.agent,person.designation].join(' ').toLowerCase().includes(query))
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    personSelect.innerHTML = `<option value="">${records.length?`Select a ${groupSelect.value} record…`:'No matching names found'}</option>`+
      records.map(person=>`<option value="${esc(person.id)}">${esc(person.employeeId||'No ID')} · ${esc(person.name)}</option>`).join('');
    personSelect.disabled = records.length===0;
    personCount.textContent = `${records.length} of ${allRecords.length} ${groupSelect.value} records shown`;
    if(previous && records.some(person=>person.id===previous)){
      personSelect.value = previous;
      populatePerson();
      return;
    }
    selectedPerson = null;
    document.getElementById('incident-person-card').classList.remove('show');
    updateProjection();
  }

  function populatePerson(){
    selectedPerson = groupRecords().find(person=>person.id===personSelect.value) || null;
    const card = document.getElementById('incident-person-card');
    card.classList.toggle('show', !!selectedPerson);
    if(!selectedPerson){ updateProjection(); return; }

    document.getElementById('incident-empid').value = selectedPerson.employeeId || '';
    document.getElementById('incident-name').value = selectedPerson.name || '';
    document.getElementById('incident-designation').value = selectedPerson.designation || '';
    document.getElementById('incident-division').value = selectedPerson.division || '';
    document.getElementById('incident-agent').value = selectedPerson.agent || '';
    document.getElementById('incident-status').value = selectedPerson.status || 'Active';
    document.getElementById('incident-current-points').value = selectedPerson.demeritPoints || 0;
    document.getElementById('incident-current-action').value = selectedPerson.action || 'No Disciplinary Action';
    const workerDetails = document.getElementById('incident-worker-details');
    workerDetails.style.display = groupSelect.value==='worker' ? '' : 'none';
    document.getElementById('incident-passport').value = selectedPerson.passportNo || '';
    document.getElementById('incident-shift').value = selectedPerson.shift || '';
    updateProjection();
  }

  function updateProjection(){
    const rule = selectedRule();
    const projection = document.getElementById('incident-projection');
    const ready = !!selectedPerson && !!rule;
    recordButton.disabled = !ready;
    projection.classList.toggle('show', ready);
    if(!ready){ projection.innerHTML = ''; return; }

    const updatedPoints = clamp((selectedPerson.demeritPoints||0) + rule.points, 0, 100);
    const tier = tierFor(updatedPoints, groupSelect.value);
    const updatedAction = updatedPoints > 0 && tier ? tier.action : 'No Disciplinary Action';
    projection.innerHTML = `<b style="color:var(--text);">Automatic result</b><br>`+
      `${esc(rule.offence)} adds <b style="color:var(--red);">${rule.points} points</b>. `+
      `Demerit points become <b style="color:var(--text);">${updatedPoints} / 100</b> and the disciplinary action becomes `+
      `<b style="color:var(--amber);">${esc(updatedAction)}</b>.`;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  groupSelect.addEventListener('change', renderPersonOptions);
  personSearch.addEventListener('input', renderPersonOptions);
  personSelect.addEventListener('change', populatePerson);
  setupOffencePicker('incident-offence', 'incident-rule', updateProjection);
  renderPersonOptions();

  recordButton.addEventListener('click', ()=>{
    const rule = selectedRule();
    if(!selectedPerson || !rule){ toast('Select a person and offence rule', '', true); return; }
    const dateInput = document.getElementById('incident-date').value || todayISODate();
    const occurredAt = dateInput===todayISODate() ? new Date().toISOString() : new Date(dateInput+'T12:00:00').toISOString();
    selectedPerson.offenceLog = selectedPerson.offenceLog||[];
    selectedPerson.offenceLog.push({
      id:uid('INC'),
      label:`[${rule.severity.replace(' Offence','')}] ${rule.offence}`,
      points:rule.points,
      ruleId:rule.id,
      date:occurredAt,
      by:currentUser()?.username || 'unknown',
      voided:false,
    });
    recalcPointsFromLog(selectedPerson, groupSelect.value);
    selectedPerson.lastModifiedBy = currentUser()?.username || 'unknown';
    selectedPerson.lastModifiedAt = new Date().toISOString();
    queueSave(groupSelect.value==='staff'?'staffs':'workers');
    closeModal();
    renderAll();
    toast('Incident recorded', `${selectedPerson.name} · ${rule.offence} (+${rule.points} pts)`);
  });
}

function openPersonModal(id, group){
  const canEdit = isAdministrator();
  if(!id && !canEdit){ requireAdminAccess(); return; }
  const isStaff = group==='staff';
  const existing = id ? findPerson(id) : null;
  const p = existing ? existing.p : {
    id: null, employeeId:'', agent: isStaff?'SALS':'', name:'', designation:'', division:'',
    status:'Active', totalPoints:100, demeritPoints:0, offenceLog:[], action:'No Disciplinary Action',
    passportNo:'', shift:'A'
  };
  const linkedFeedback = id ? state.feedback.filter(item=>item.subjectPersonId===id && item.subjectGroup===group) : [];

  openModal(`
    <div class="modal-head">
      <h3>${id? (canEdit?'Edit Record — ':'View Record — ')+esc(p.name) : 'Add '+(isStaff?'Staff':'Worker')+' Record'}</h3>
      <button class="btn ghost sm" id="modal-close">${ICONS.x}</button>
    </div>
    <div class="modal-body">
      ${id && canEdit ? `
      <div class="field">
        <label for="edit-person-search">Search Name to Update</label>
        <div class="offence-picker-search">${ICONS.search}<input id="edit-person-search" type="search" autocomplete="off" placeholder="Search ${isStaff?'staff':'worker'} name, employee ID or division…"/></div>
        <select id="edit-person-select" style="margin-top:8px;" aria-label="Matching records to update"></select>
        <div class="offence-picker-count" id="edit-person-count"></div>
      </div>` : ''}
      <div class="field-row">
        <div class="field"><label>Employee ID</label><input id="f-empid" value="${esc(p.employeeId)}" placeholder="e.g. S2500123"/></div>
        <div class="field"><label>${isStaff?'Agent':'Agent (subcontractor)'}</label><input id="f-agent" value="${esc(p.agent)}" placeholder="e.g. SALS"/></div>
      </div>
      <div class="field"><label>Full Name</label><input id="f-name" value="${esc(p.name)}" placeholder="Full name"/></div>
      <div class="field-row">
        <div class="field"><label>Designation</label><input id="f-desig" value="${esc(p.designation)}" placeholder="e.g. Picker"/></div>
        <div class="field"><label>${isStaff?'Division':'Division / Line'}</label><input id="f-division" value="${esc(p.division)}" placeholder="e.g. Outbound"/></div>
      </div>
      ${!isStaff ? `
      <div class="field-row">
        <div class="field"><label>Passport No.</label><input id="f-passport" value="${esc(p.passportNo)}" placeholder="Passport / ID no."/></div>
        <div class="field"><label>Shift</label>
          <select id="f-shift"><option ${p.shift==='A'?'selected':''}>A</option><option ${p.shift==='B'?'selected':''}>B</option><option ${p.shift==='C'?'selected':''}>C</option></select>
        </div>
      </div>` : ''}
      <div class="field-row">
        <div class="field"><label>Status</label>
          <select id="f-status"><option ${p.status==='Active'?'selected':''}>Active</option><option ${p.status==='Suspended'?'selected':''}>Suspended</option><option ${p.status==='Terminated'?'selected':''}>Terminated</option><option ${p.status==='Inactive'?'selected':''}>Inactive</option></select>
        </div>
        <div class="field"><label>Demerit Points (0–100)</label><input id="f-points" type="number" min="0" max="100" value="${p.demeritPoints}" readonly/></div>
      </div>

      ${id && canEdit ? `
      <div class="field">
        <label>Apply Offence <span class="hint" style="text-transform:none;font-weight:400;">— adds points from the rule library, recorded under your sign-in</span></label>
        <div class="field-row" style="margin-bottom:8px;">
          <div class="field"><label>Date of offence</label><input id="f-offence-date" type="date" value="${todayISODate()}" max="${todayISODate()}"/></div>
        </div>
        ${offencePickerControlsHtml('edit-offence')}
        <div style="display:flex;gap:8px;">
          <select id="f-apply-offence" style="flex:1;" aria-label="Matching offence rules"></select>
          <button class="btn sm" id="btn-apply-offence">Apply</button>
        </div>
        <div class="offence-picker-count" id="edit-offence-count"></div>
      </div>` : ''}
      ${id ? `
      <div class="field">
        <label>Offence History <span class="hint" style="text-transform:none;font-weight:400;">${p.offenceLog.filter(o=>!o.voided).length} active entr${p.offenceLog.filter(o=>!o.voided).length===1?'y':'ies'}</span></label>
        <div class="of-log" id="of-log">
          ${p.offenceLog.length===0 ? `<div class="hint">No offences logged.</div>` : p.offenceLog.map((o,i)=>`
            <div class="row" style="${o.voided?'opacity:.55;':''}">
              <span>${o.voided?'<span class="badge inactive">VOIDED</span> ':''}OF${i+1}. ${esc(o.label)}
                <div class="of-meta">${o.date?fmtDate(o.date):'—'} · logged by ${esc(o.by||'legacy import')}${o.voided?` · voided ${o.voidedAt?fmtDate(o.voidedAt):''} by ${esc(o.voidedBy||'administrator')}`:''}</div>
              </span>
              <span class="p">+${o.points}</span>
              ${canEdit&&!o.voided?`<button class="iconbtn del sm" style="width:20px;height:20px;" data-remove-of="${i}" title="Void this offence entry" aria-label="Void ${esc(o.label)}">${ICONS.x}</button>`:''}
            </div>
          `).join('')}
        </div>
        ${canEdit&&p.offenceLog.length?`<div style="display:flex;justify-content:flex-end;margin-top:6px;"><button class="btn danger sm" id="btn-clear-offence-history">${ICONS.trash} Clear all offence history</button></div>`:''}
      </div>` : `<div class="hint">You can log offences after the record is created.</div>`}

      ${id?`<div class="field">
        <label>Appeal <span class="hint" style="text-transform:none;font-weight:400;">manager response · Admin or Super Admin review</span></label>
        ${isStandardUser()?`<div class="manager-response-controls">
          <div class="field-row"><div class="field"><label>Response Type</label><input data-feedback-input value="Appeal" readonly></div><div class="field"><label>Review Status</label><input data-feedback-input value="Pending after submission" readonly></div></div>
          <textarea id="person-feedback-body" data-feedback-input maxlength="5000" placeholder="Submit an appeal for this person…" style="min-height:100px;resize:vertical;"></textarea>
          <div style="display:flex;justify-content:flex-end;margin-top:8px;"><button class="btn primary sm" id="btn-submit-person-feedback">${ICONS.message} Submit</button></div>
        </div>`:''}
        <div class="feedback-list" style="margin-top:8px;">${linkedFeedback.length?linkedFeedback.map(item=>feedbackItemHtml(item,isAdministrator())).join(''):'<div class="hint">No comments or appeals are linked to this record.</div>'}</div>
      </div>`:''}

      <div class="field">
        <label>Disciplinary Action <span class="hint" style="text-transform:none;font-weight:400;">auto-computed from thresholds</span></label>
        <input id="f-action" value="${esc(p.action)}" readonly/>
      </div>
    </div>
    <div class="modal-foot">
      ${id && canEdit? `<button class="btn danger" id="btn-del-inline">${ICONS.trash} Delete</button>`:''}
      <div class="spacer" style="flex:1;"></div>
      <button class="btn ghost" id="btn-cancel">${canEdit?'Cancel':'Close'}</button>
      ${canEdit?`<button class="btn primary" id="btn-save">${id?'Save Changes':'Create Record'}</button>`:''}
    </div>
  `, false);

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  if(!canEdit){
    document.querySelectorAll('#modal input:not([data-feedback-input]), #modal select:not([data-feedback-input]), #modal textarea:not([data-feedback-input])').forEach(field=>{ field.disabled = true; });
  }
  const personFeedbackButton = document.getElementById('btn-submit-person-feedback');
  if(personFeedbackButton) personFeedbackButton.addEventListener('click', async ()=>{
    const body=document.getElementById('person-feedback-body').value.trim();
    if(body.length<5){ toast('More detail required', 'The appeal must contain at least 5 characters.', true); return; }
    personFeedbackButton.disabled=true;
    try{
      const response=await fetch('/api/feedback',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'appeal',body,subjectPersonId:id,subjectGroup:group})});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error || 'Unable to submit the appeal');
      await refreshFeedback(false);
      openPersonModal(id, group);
      toast('Appeal submitted', 'Status: pending Admin review.');
    }catch(error){ toast('Appeal submission failed', error.message, true); personFeedbackButton.disabled=false; }
  });
  document.querySelectorAll('#modal [data-moderate-id]').forEach(button=>button.addEventListener('click',()=>moderateSubmission(button,{id,group})));
  if(id && canEdit){
    const personSearch = document.getElementById('edit-person-search');
    const personSelect = document.getElementById('edit-person-select');
    const personCount = document.getElementById('edit-person-count');
    const renderMatchingPeople = ()=>{
      const records = isStaff ? state.staffs : state.workers;
      const query = personSearch.value.toLowerCase().trim();
      const matches = records
        .filter(person=>!query || [person.name,person.employeeId,person.division,person.agent,person.designation].join(' ').toLowerCase().includes(query))
        .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      personSelect.innerHTML = `<option value="">${matches.length?`Select a ${group} record to update…`:'No matching names found'}</option>`+
        matches.map(person=>`<option value="${esc(person.id)}">${esc(person.name)} · ${esc(person.employeeId||'No ID')}${person.id===id?' (current record)':''}</option>`).join('');
      personSelect.disabled = matches.length===0;
      personCount.textContent = `${matches.length} of ${records.length} ${group} records shown`;
    };
    personSearch.addEventListener('input', renderMatchingPeople);
    personSelect.addEventListener('change', ()=>{
      if(personSelect.value && personSelect.value!==id) openPersonModal(personSelect.value, group);
    });
    renderMatchingPeople();
    document.getElementById('btn-del-inline').addEventListener('click', ()=>{ closeModal(); confirmDeletePerson(id, group); });
    document.querySelectorAll('[data-remove-of]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const idx = +b.dataset.removeOf;
        const entry = p.offenceLog[idx];
        if(!entry || entry.voided) return;
        if(!confirm(`Void "${entry.label}" (+${entry.points} pts)? The audit history will be preserved.`)) return;
        entry.voided = true;
        entry.voidedAt = new Date().toISOString();
        entry.voidedBy = currentUser()?.username || 'unknown';
        recalcPointsFromLog(p, group);
        p.lastModifiedBy = currentUser()?.username || 'unknown';
        p.lastModifiedAt = new Date().toISOString();
        queueSave(isStaff?'staffs':'workers');
        openPersonModal(id, group);
        renderPeopleTable(group);
        toast('Offence voided', entry.label);
      });
    });
    const clearHistoryButton = document.getElementById('btn-clear-offence-history');
    if(clearHistoryButton) clearHistoryButton.addEventListener('click', ()=>{
      const entryCount = p.offenceLog.length;
      if(!confirm(`Clear all ${entryCount} offence history entr${entryCount===1?'y':'ies'} for ${p.name}? This resets their demerit points and recommended action. The change remains recorded in the server audit trail.`)) return;
      p.offenceLog = [];
      recalcPointsFromLog(p, group);
      p.lastModifiedBy = currentUser()?.username || 'unknown';
      p.lastModifiedAt = new Date().toISOString();
      queueSave(isStaff?'staffs':'workers');
      renderAll();
      openPersonModal(id, group);
      toast('Offence history cleared', `${p.name} · ${entryCount} entr${entryCount===1?'y':'ies'} removed`);
    });

    const applyOffenceRule = (ruleId)=>{
      if(!ruleId) return;
      const rule = state.offences.find(o=>o.id===ruleId);
      if(!rule) return;
      const dateInput = document.getElementById('f-offence-date').value || todayISODate();
      // Combine the chosen (possibly backdated) date with the current time-of-day for entries
      // logged today, or noon for backdated entries where the exact time isn't known.
      const isToday = dateInput === todayISODate();
      const occurredAt = isToday ? new Date().toISOString() : new Date(dateInput+'T12:00:00').toISOString();
      p.offenceLog.push({
        id: uid('INC'),
        label: `[${rule.severity.replace(' Offence','')}] ${rule.offence}`,
        points: rule.points, ruleId: rule.id,
        date: occurredAt,
        by: currentUser()?.username || 'unknown',
        voided: false,
      });
      recalcPointsFromLog(p, group);
      p.lastModifiedBy = currentUser()?.username || 'unknown';
      p.lastModifiedAt = new Date().toISOString();
      queueSave(isStaff?'staffs':'workers');
      renderPeopleTable(group);
      toast('Offence applied', `${rule.offence} (+${rule.points} pts) — ${p.action}`);
      openPersonModal(id, group);
    };
    setupOffencePicker('edit-offence', 'f-apply-offence');
    // Applies the instant you pick a rule from the filtered dropdown — no extra click needed,
    // and it's saved immediately so nothing is lost if you close the modal.
    document.getElementById('f-apply-offence').addEventListener('change', (e)=>{
      applyOffenceRule(e.target.value);
    });
    document.getElementById('btn-apply-offence').addEventListener('click', ()=>{
      applyOffenceRule(document.getElementById('f-apply-offence').value);
    });
  }

  const saveButton = document.getElementById('btn-save');
  if(saveButton) saveButton.addEventListener('click', ()=>{
    if(!requireAdminAccess()) return;
    const vals = {
      employeeId: document.getElementById('f-empid').value.trim(),
      agent: document.getElementById('f-agent').value.trim(),
      name: document.getElementById('f-name').value.trim(),
      designation: document.getElementById('f-desig').value.trim(),
      division: document.getElementById('f-division').value.trim(),
      status: document.getElementById('f-status').value,
    };
    if(!isStaff){
      vals.passportNo = document.getElementById('f-passport').value.trim();
      vals.shift = document.getElementById('f-shift').value;
    }
    if(!vals.name){ toast('Name is required', '', true); return; }
    if(!vals.employeeId){ toast('Employee ID is required', '', true); return; }
    const targetRecords = isStaff ? state.staffs : state.workers;
    if(targetRecords.some(person=>person.id!==id && String(person.employeeId||'').trim().toLowerCase()===vals.employeeId.toLowerCase())){
      toast('Employee ID must be unique', `${vals.employeeId} already exists in ${group} records.`, true);
      return;
    }

    vals.lastModifiedBy = currentUser()?.username || 'unknown';
    vals.lastModifiedAt = new Date().toISOString();

    if(id){
      Object.assign(p, vals);
      recalcPointsFromLog(p, group);
    } else {
      const newRec = { id: uid(isStaff?'STF':'WKR'), offenceLog: [], demeritPoints:0, totalPoints:100, action:'No Disciplinary Action', ...vals };
      targetRecords.push(newRec);
    }
    queueSave(isStaff?'staffs':'workers');
    closeModal();
    renderAll();
    toast(id? 'Record updated' : 'Record created', vals.name);
  });
}


function confirmDeletePerson(id, group){
  if(!requireAdminAccess()) return;
  const isStaff = group==='staff';
  const arr = isStaff ? state.staffs : state.workers;
  const p = arr.find(x=>x.id===id);
  if(!p) return;
  openModal(`
    <div class="modal-head"><h3>Delete record?</h3><button class="btn ghost sm" id="modal-close">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="hint" style="font-size:13px;color:var(--text);">This permanently removes <b>${esc(p.name)}</b> (${esc(p.employeeId)||'no ID'}) from the shared online ${isStaff?'staff':'worker'} ledger. The deletion will be visible to everyone with authorized access and cannot be undone.</div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btn-cancel">Cancel</button>
      <button class="btn danger" id="btn-confirm-del">${ICONS.trash} Delete permanently</button>
    </div>
  `, false);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-confirm-del').addEventListener('click', ()=>{
    const idx = arr.findIndex(x=>x.id===id);
    if(idx>-1) arr.splice(idx,1);
    queueSave(isStaff?'staffs':'workers');
    closeModal();
    renderAll();
    toast('Record deleted', p.name);
  });
}

/* ============ OFFENCE RULES ============ */
function renderOffences(){
  const q = (state.search.offences||'').toLowerCase().trim();
  let rows = state.offences.filter(o=> !q || (o.offence+' '+o.severity).toLowerCase().includes(q));
  rows = rows.slice().sort((a,b)=> b.points - a.points);
  const el = document.getElementById('view-offences');
  el.innerHTML = `
    <div class="table-wrap">
      <div class="table-toolbar"><div class="hint">${rows.length} of ${state.offences.length} rules · sorted by points, highest first</div></div>
      <div class="table-scroll-hint">Swipe left or right to see all columns</div>
      <div class="table-scroll table-scroll-offences" tabindex="0" role="region" aria-label="Offence rules">
        <table>
          <thead><tr><th>Severity</th><th>Offence</th><th>Points</th><th>Rationale</th><th style="text-align:right;">${isAdministrator()?'Manage':'View'}</th></tr></thead>
          <tbody>
            ${rows.map(o=>`
              <tr>
                <td><span class="badge ${severityClass(o.severity)}">${esc((o.severity||'').replace(' Offence',''))}</span></td>
                <td style="max-width:340px;">${esc(o.offence)}</td>
                <td class="pts" style="color:${o.points>=70?'var(--red)':o.points>=41?'var(--orange)':'var(--amber)'}">${o.points}</td>
                <td class="hint" style="max-width:320px;">${esc(o.reason||'')}</td>
                <td><div class="row-actions">
                  ${isAdministrator()?`<button class="iconbtn" title="Edit offence rule" aria-label="Edit ${esc(o.offence)}" data-edit-rule="${o.id}">${ICONS.edit}</button>
                  <button class="iconbtn del" title="Delete offence rule" aria-label="Delete ${esc(o.offence)}" data-del-rule="${o.id}">${ICONS.trash}</button>`:`<button class="btn sm ghost" data-view-rule="${o.id}">View</button>`}
                </div></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
  el.querySelectorAll('[data-edit-rule]').forEach(b=> b.addEventListener('click', ()=> openRuleModal(b.dataset.editRule)));
  el.querySelectorAll('[data-del-rule]').forEach(b=> b.addEventListener('click', ()=> confirmDeleteRule(b.dataset.delRule)));
  el.querySelectorAll('[data-view-rule]').forEach(b=> b.addEventListener('click', ()=> openRuleModal(b.dataset.viewRule)));
}

function openRuleModal(id){
  const canEdit = isAdministrator();
  if(!id && !canEdit){ requireAdminAccess(); return; }
  const rule = id ? state.offences.find(o=>o.id===id) : { severity:'Low Offence', offence:'', points:10, reason:'' };
  openModal(`
    <div class="modal-head"><h3>${id?(canEdit?'Edit Offence Rule':'View Offence Rule'):'Add Offence Rule'}</h3><button class="btn ghost sm" id="modal-close">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="field-row">
        <div class="field"><label>Severity</label>
          <select id="f-sev">
            <option value="Major Offence" ${rule.severity==='Major Offence'?'selected':''}>Major Offence</option>
            <option value="Minor Offence" ${rule.severity==='Minor Offence'?'selected':''}>Minor Offence</option>
            <option value="Low Offence" ${rule.severity==='Low Offence'?'selected':''}>Low Offence</option>
          </select>
        </div>
        <div class="field"><label>Demerit Points</label><input id="f-pts" type="number" min="1" max="100" value="${rule.points}"/></div>
      </div>
      <div class="field"><label>Offence Description</label><textarea id="f-offence" rows="2">${esc(rule.offence)}</textarea></div>
      <div class="field"><label>Reason / Basis</label><textarea id="f-reason" rows="3">${esc(rule.reason||'')}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btn-cancel">${canEdit?'Cancel':'Close'}</button>
      ${canEdit?`<button class="btn primary" id="btn-save-rule">${id?'Save Changes':'Add Rule'}</button>`:''}
    </div>
  `, false);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  if(!canEdit){
    document.querySelectorAll('#modal input, #modal select, #modal textarea').forEach(field=>{ field.disabled = true; });
    return;
  }
  document.getElementById('btn-save-rule').addEventListener('click', ()=>{
    if(!requireAdminAccess()) return;
    const vals = {
      severity: document.getElementById('f-sev').value,
      points: clamp(parseFloat(document.getElementById('f-pts').value)||0, 1, 100),
      offence: document.getElementById('f-offence').value.trim(),
      reason: document.getElementById('f-reason').value.trim(),
    };
    if(!vals.offence){ toast('Offence description required','',true); return; }
    if(id){ Object.assign(rule, vals); }
    else { state.offences.push({ id: uid('OFR'), ...vals }); }
    queueSave('offences');
    closeModal();
    renderAll();
    toast(id?'Rule updated':'Rule added', vals.offence);
  });
}

function confirmDeleteRule(id){
  if(!requireAdminAccess()) return;
  const rule = state.offences.find(o=>o.id===id);
  if(!rule) return;
  openModal(`
    <div class="modal-head"><h3>Delete offence rule?</h3><button class="btn ghost sm" id="modal-close">${ICONS.x}</button></div>
    <div class="modal-body"><div style="font-size:13px;">Remove <b>${esc(rule.offence)}</b> from the live rule library? Existing offence-log entries already applied to people are not affected.</div></div>
    <div class="modal-foot">
      <button class="btn ghost" id="btn-cancel">Cancel</button>
      <button class="btn danger" id="btn-confirm-del">${ICONS.trash} Delete</button>
    </div>
  `, false);
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  document.getElementById('btn-confirm-del').addEventListener('click', ()=>{
    const idx = state.offences.findIndex(o=>o.id===id);
    if(idx>-1) state.offences.splice(idx,1);
    queueSave('offences');
    closeModal();
    renderAll();
    toast('Rule deleted', rule.offence);
  });
}

/* ============ THRESHOLDS ============ */
function renderThresholds(){
  const el = document.getElementById('view-thresholds');
  const table = (rows,label) => `
    <div class="panel">
      <h3>${label} <span class="tag">${rows.length} bands</span></h3>
      <div class="table-scroll-hint">Swipe left or right to see all columns</div>
      <div class="table-scroll table-scroll-thresholds" tabindex="0" role="region" aria-label="${esc(label)} thresholds">
        <table>
          <thead><tr><th>Points</th><th>Severity</th><th>Action</th><th>Authority</th></tr></thead>
          <tbody>
            ${rows.slice().sort((a,b)=>(b.min||0)-(a.min||0)).map(r=>`
              <tr>
                <td class="pts">${esc(r.band)}</td>
                <td><span class="badge ${severityClass(r.severity)}">${esc(r.severity)}</span></td>
                <td>${esc(r.action)}</td>
                <td class="hint">${esc(r.authority)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  el.innerHTML = `<div class="grid-2" style="align-items:start;">
      ${table(state.sdp, 'Staff Disciplinary Points (SDP)')}
      ${table(state.wdp, 'Worker Disciplinary Points (WDP)')}
    </div>
    <div class="panel"><div class="hint" style="line-height:1.7;">Thresholds drive the Dashboard's recommended action and each person's automatically calculated disciplinary action. The worker pathway progresses through investigation, a <b>written warning or temporary shift reassignment at 51–60 points</b>, an agency-coordinated final warning at 61–69, and management review at 70–84. <b>A ban is considered only after final review at 85 points or above.</b></div></div>`;
}

/* ============ IMPORT / EXPORT ============ */
function renderDataTab(){
  const el = document.getElementById('view-data');
  const canEdit = isAdministrator();
  el.innerHTML = `
    ${backupBannerHtml()}
    <div class="grid-2" style="align-items:start;">
      <div class="panel">
        <h3>Import from Excel</h3>
        ${canEdit?`
        <div class="import-drop" id="drop-zone">
          ${ICONS.upload}
          <div><b>Click to choose a workbook</b> or drag it here</div>
          <div class="hint" style="margin-top:6px;">Supports "Offences", "Staffs-Records", "Workers-Records", "Incidents", "Staffs-Point" and "Workers-Points" sheets. Missing sheets are skipped.</div>

function handleImportFile(e){
  if(!requireAdminAccess()) return;
  const file = e.target.files[0];
  if(file) importWorkbookFile(file);

}

function handleOffenceRulesFile(e){
  if(!requireAdminAccess()) return;
  const file = e.target.files[0];
  e.target.value = '';
  if(file) importOffenceRulesFile(file);
}

function findHeaderRow(rows, mustHave){
  for(let i=0;i<Math.min(rows.length,6);i++){
    const cells = (rows[i]||[]).map(c=> (c===undefined||c===null)?'':String(c));
    if(cells.some(c=> c.trim().toLowerCase() === mustHave.toLowerCase())) return i;
  }
  return -1;
}

function sheetRowsToObjects(ws, mustHaveHeader){
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null });
  const hIdx = findHeaderRow(rows, mustHaveHeader);
  if(hIdx===-1) return null;
  const headers = rows[hIdx].map(h=> h===null?'':String(h).trim());
  const out = [];
  for(let r=hIdx+1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.every(v=>v===null||v==='')) continue;
    const obj = {};
    headers.forEach((h,ci)=>{ if(h) obj[h]=row[ci]; });
    out.push(obj);
  }
  return out;
}

function parsePeopleSheet(rawRows, isStaff, existingArr, mode, hasDetailedIncidents){
  const byEmpId = new Map();
  const byRecordId = new Map();
  existingArr.forEach(person=>{
    const employeeId = String(person.employeeId||'').trim().toLowerCase();
    if(employeeId) byEmpId.set(employeeId,person);
    if(person.id) byRecordId.set(String(person.id).trim(),person);
  });
  const out = mode==='merge' ? existingArr.slice() : [];
  rawRows.forEach(r=>{
    const empId = r['Employee ID'] ? String(r['Employee ID']).trim() : '';
    const importedRecordId = r['Record ID'] ? String(r['Record ID']).trim() : '';
    const existing = (importedRecordId && byRecordId.get(importedRecordId)) ||
      (empId && byEmpId.get(empId.toLowerCase())) || null;
    // Read every OF# column present (not capped at 10), so records exported with more than
    // 10 logged offences round-trip correctly on re-import.
    const ofKeys = Object.keys(r).filter(k=>/^OF\d+$/i.test(k)).sort((a,b)=> parseInt(a.slice(2))-parseInt(b.slice(2)));
    const ofPts = [];
    ofKeys.forEach(k=>{ const v = r[k]; if(v!==null && v!==undefined && v!==''){ const n=parseFloat(v); if(!isNaN(n) && n>0) ofPts.push(n); } });
    const preservedLog = !hasDetailedIncidents && existing && Array.isArray(existing.offenceLog) && existing.offenceLog.length
      ? existing.offenceLog.map(incident=>({...incident}))
      : null;
    const mergeLog = hasDetailedIncidents && mode==='merge' && existing && Array.isArray(existing.offenceLog)
      ? existing.offenceLog.map(incident=>({...incident}))
      : null;
    const demerit = hasDetailedIncidents ? (mergeLog
      ? mergeLog.reduce((sum,incident)=>sum+(incident.voided?0:(Number(incident.points)||0)),0)
      : 0) : preservedLog
      ? preservedLog.reduce((sum,incident)=>sum+(incident.voided?0:(Number(incident.points)||0)),0)
      : r['Demerit Point']!=null ? parseFloat(r['Demerit Point'])||0 : ofPts.reduce((s,n)=>s+n,0);
    const rec = {
      id: existing ? existing.id : (importedRecordId || uid(isStaff?'STF':'WKR')),
      employeeId: empId,
      agent: r['Agent'] ? String(r['Agent']).trim() : '',
      name: r['Name'] ? String(r['Name']).trim() : '',
      designation: r['Designation'] ? String(r['Designation']).trim() : '',
      division: r['Division'] ? String(r['Division']).trim() : '',
      status: r['Status'] ? String(r['Status']).trim() : 'Active',
      demeritPoints: clamp(demerit,0,100),
      totalPoints: clamp(100-demerit,0,100),
      offenceLog: hasDetailedIncidents ? (mergeLog || []) : preservedLog || ofPts.map((p,j)=>({id:uid('INC'),label:`Imported offence ${j+1}`, points:p, by:'workbook import', voided:false})),
      action: r['Disciplinary Action Taken'] ? String(r['Disciplinary Action Taken']).trim() : 'No Disciplinary Action',
      lastModifiedBy: r['Last Modified By'] ? String(r['Last Modified By']).trim() : (currentUser()?.username||'import'),
      lastModifiedAt: r['Last Modified At'] ? String(r['Last Modified At']).trim() : new Date().toISOString(),
    };
    if(!isStaff){
      rec.passportNo = r['Passport No.'] ? String(r['Passport No.']).trim() : '';
      rec.shift = r['Shift'] ? String(r['Shift']).trim() : '';
    }
    if(!rec.name) return;
    if(mode==='merge' && existing){
      const idx = out.findIndex(p=>p.id===rec.id);
      if(idx>-1) out[idx] = rec;
    } else {
      out.push(rec);
    }
  });
  if(mode==='replace' && !hasDetailedIncidents){
    const importedIds = new Set(out.map(person=>person.id));
    existingArr.forEach(person=>{
      if(!importedIds.has(person.id) && Array.isArray(person.offenceLog) && person.offenceLog.length){
        out.push(person);
      }
    });
  }
  return out;
}

function parseOffenceSheet(rawRows){
  return rawRows.filter(r=>r['Offences']).map((r,i)=>({
    id: uid('OFR'),
    severity: r['Severity'] ? String(r['Severity']).trim() : 'Low Offence',
    offence: String(r['Offences']).trim(),
    points: r['Demerit Points']!=null ? parseFloat(r['Demerit Points'])||0 : 0,
    reason: r['Reason/Basis'] ? String(r['Reason/Basis']).trim() : '',
  }));
}

function offenceImportColumnName(value){
  const header = String(value??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
  if(['offence','offences','offense','offenses','offence rule','offense rule','offence description','offense description','description'].includes(header)) return 'offence';
  if(['demerit points','demerit point','points','point','score'].includes(header)) return 'points';
  if(['severity','category','severity category'].includes(header)) return 'severity';
  if(['reason basis','reason','basis','rationale'].includes(header)) return 'reason';
  if(['rule id','offence id','offense id','id'].includes(header)) return 'id';
  return '';
}

function parseOffenceRulesRows(rows, existingRules){
  let headerIndex = -1;
  let columns = [];
  for(let index=0;index<Math.min(rows.length,15);index++){
    const possibleColumns = (rows[index]||[]).map(offenceImportColumnName);
    if(possibleColumns.includes('offence') && possibleColumns.includes('points')){
      headerIndex = index;
      columns = possibleColumns;
      break;
    }
  }
  if(headerIndex<0) return null;

  const normalizedName = value=>String(value??'').trim().toLowerCase().replace(/\s+/g,' ');
  const existingByName = new Map(existingRules.map(rule=>[normalizedName(rule.offence),rule]));
  const existingById = new Map(existingRules.map(rule=>[normalizedName(rule.id),rule]));
  const imported = [];
  const seenIds = new Set();
  const seenNames = new Set();

  for(let index=headerIndex+1;index<rows.length;index++){
    const row = rows[index]||[];
    if(row.every(value=>value===null || value===undefined || String(value).trim()==='')) continue;
    const read = key=>{
      const column = columns.indexOf(key);
      return column<0 ? null : row[column];
    };
    const offence = String(read('offence')??'').trim();
    const rowNumber = index+1;
    if(!offence) throw new Error(`Row ${rowNumber}: an offence description is required.`);
    if(offence.length>1000) throw new Error(`Row ${rowNumber}: the offence description cannot exceed 1,000 characters.`);
    const offenceName = normalizedName(offence);
    if(seenNames.has(offenceName)) throw new Error(`Row ${rowNumber}: "${offence}" appears more than once.`);

    const rawPoints = read('points');
    const points = typeof rawPoints==='string' && !rawPoints.trim() ? NaN : Number(rawPoints);
    if(!Number.isFinite(points) || points<1 || points>100) throw new Error(`Row ${rowNumber}: demerit points must be a number from 1 to 100.`);

    let severity = String(read('severity')??'').trim() || 'Low Offence';
    const knownSeverity = severity.match(/^(major|minor|low)(?:\s+offen[cs]e)?$/i);
    if(knownSeverity) severity = knownSeverity[1].slice(0,1).toUpperCase()+knownSeverity[1].slice(1).toLowerCase()+' Offence';
    if(severity.length>100) throw new Error(`Row ${rowNumber}: severity cannot exceed 100 characters.`);
    const reason = String(read('reason')??'').trim();
    if(reason.length>2000) throw new Error(`Row ${rowNumber}: the reason cannot exceed 2,000 characters.`);

    const providedId = String(read('id')??'').trim();
    const matchingRule = existingById.get(normalizedName(providedId)) || existingByName.get(offenceName);
    const id = matchingRule?.id || providedId || uid('OFR');
    if(id.length>100) throw new Error(`Row ${rowNumber}: the rule ID cannot exceed 100 characters.`);
    if(seenIds.has(normalizedName(id))) throw new Error(`Row ${rowNumber}: the rule ID "${id}" appears more than once.`);
    seenIds.add(normalizedName(id));
    seenNames.add(offenceName);
    imported.push({id,severity,offence,points,reason});
    if(imported.length>10000) throw new Error('An offence-rule import cannot contain more than 10,000 rules.');
  }

  if(!imported.length) throw new Error('The selected file does not contain any offence rules.');
  return imported;
}

async function importOffenceRulesFile(file){
  if(!requireAdminAccess()) return;
  if(saveConflict){ toast('Refresh required', 'Shared records changed elsewhere. Refresh before importing rules.', true); return; }
  try{
    const workbook = /\.csv$/i.test(file.name)
      ? XLSX.read(await file.text(), {type:'string'})
      : XLSX.read(await file.arrayBuffer(), {type:'array'});
    const sheetNames = workbook.SheetNames.slice().sort((left,right)=>Number(/offen[cs]e|rules?/i.test(right))-Number(/offen[cs]e|rules?/i.test(left)));
    let imported = null;
    for(const name of sheetNames){
      const rows = XLSX.utils.sheet_to_json(workbook.Sheets[name], {header:1,raw:true,defval:null});
      imported = parseOffenceRulesRows(rows, state.offences);
      if(imported) break;
    }
    if(!imported) throw new Error('The file must include offence description and demerit points columns, such as "Offences" and "Demerit Points".');
    if(!confirm(`Replace the current ${state.offences.length} offence rules with ${imported.length} rules from ${file.name}? Staff, workers, incidents, and thresholds will not change.`)) return;

    const previousOffences = state.offences;
    const previousMeta = {...state.meta};
    state.offences = imported;
    state.meta.lastImport = `${file.name} — ${new Date().toLocaleString()} (offence rules)`;
    markSyncing(true);
    const saved = await persist('offences');
    if(!saved){
      if(!saveConflict){
        state.offences = previousOffences;
        state.meta = previousMeta;
      }
      renderAll();
      return;
    }
    renderAll();
    toast('Offence rules imported', `${imported.length} rules are now synced online.`);
  }catch(error){
    console.error('Offence rule import failed', error);
    toast('Offence rule import failed', error.message || 'The selected file could not be read.', true);
  }
}

function parseIncidentSheet(rawRows){
  const byPerson = new Map();
  rawRows.forEach(row=>{
    const personId = row['Person Record ID'] ? String(row['Person Record ID']).trim() : '';
    const employeeId = row['Employee ID'] ? String(row['Employee ID']).trim().toLowerCase() : '';
    const group = row['Person Type'] ? String(row['Person Type']).trim().toLowerCase() : '';
    if(!personId && (!employeeId || !group)) return;
    const key = personId ? `id:${personId}` : `employee:${group}:${employeeId}`;
    const points = Number(row['Points']);
    if(!Number.isFinite(points) || points<0 || points>100) return;
    const incident = {
      id: row['Incident ID'] ? String(row['Incident ID']).trim() : uid('INC'),
      ruleId: row['Rule ID'] ? String(row['Rule ID']).trim() : undefined,
      label: row['Description'] ? String(row['Description']).trim() : 'Imported incident',
      points,
      date: row['Occurred At'] ? String(row['Occurred At']).trim() : undefined,
      by: row['Logged By'] ? String(row['Logged By']).trim() : 'workbook import',
      voided: String(row['Voided']||'').trim().toLowerCase()==='yes' || row['Voided']===true,
      voidedAt: row['Voided At'] ? String(row['Voided At']).trim() : undefined,
      voidedBy: row['Voided By'] ? String(row['Voided By']).trim() : undefined,
    };
    if(!incident.label) incident.label = 'Imported incident';
    if(!byPerson.has(key)) byPerson.set(key, []);
    byPerson.get(key).push(incident);
  });
  return byPerson;
}

function attachImportedIncidents(incidentMap, mode, affectedGroups){
  for(const [group, records] of [['staff',state.staffs],['worker',state.workers]]){
    records.forEach(person=>{
      const byId = incidentMap.get(`id:${person.id}`);
      const byEmployee = incidentMap.get(`employee:${group}:${String(person.employeeId||'').trim().toLowerCase()}`);
      const imported = byId || byEmployee;
      if(imported){
        person.offenceLog = imported;
        recalcPointsFromLog(person,group);
      }
      else if(mode!=='merge' && affectedGroups.has(group)){
        person.offenceLog = [];
        recalcPointsFromLog(person,group);
      }
    });
  }
}

function parseThresholdSheet(rawRows, group){
  const actionColumn = group==='staff' ? 'Staff Disciplinary Action' : 'Workers Disciplinary Action';
  return rawRows.map(row=>{
    const band = row['Demerit Points'] ? String(row['Demerit Points']).trim() : '';
    const numbers = band.match(/\d+/g)?.map(Number) || [];
    const min = row['Minimum']!==undefined && row['Minimum']!==null ? Number(row['Minimum']) : numbers[0];
    const max = row['Maximum']!==undefined && row['Maximum']!==null ? Number(row['Maximum']) : (numbers[1] ?? numbers[0]);
    return {
      band,
      severity: row['Severity'] ? String(row['Severity']).trim() : '',
      action: row[actionColumn] ? String(row[actionColumn]).trim() : '',
      authority: row['Escalation / Approval Authority'] ? String(row['Escalation / Approval Authority']).trim() : '',
      min,
      max,
    };
  }).filter(row=>row.band && row.severity && row.action && row.authority && Number.isFinite(row.min) && Number.isFinite(row.max));
}

function importWorkbookFile(file){
  if(!requireAdminAccess()) return;
  const status = document.getElementById('import-status');
  if(status) status.innerHTML = `<span class="mono">Reading ${esc(file.name)}…</span>`;
  const reader = new FileReader();
  reader.onload = async (e) => {
    let previousState = null;
    try{
      const wb = XLSX.read(e.target.result, { type:'array' });
      const mode = document.getElementById('import-mode') ? document.getElementById('import-mode').value : 'replace';
      previousState = structuredClone({offences:state.offences,staffs:state.staffs,workers:state.workers,sdp:state.sdp,wdp:state.wdp,meta:state.meta});
      let importedOffences=0, importedStaff=0, importedWorkers=0, importedIncidents=0, importedThresholds=0;
      const incidentSheetName = wb.SheetNames.find(n=>/^incidents?$/i.test(n.trim()));
      const hasDetailedIncidents = !!incidentSheetName;
      const staffSheetName = wb.SheetNames.find(n=>/staff/i.test(n) && /record/i.test(n)) || wb.SheetNames.find(n=>/staff/i.test(n));
      const workerSheetName = wb.SheetNames.find(n=>/worker/i.test(n) && /record/i.test(n)) || wb.SheetNames.find(n=>/worker/i.test(n));
      const staffRows = staffSheetName ? sheetRowsToObjects(wb.Sheets[staffSheetName], 'Employee ID') : null;
      const workerRows = workerSheetName ? sheetRowsToObjects(wb.Sheets[workerSheetName], 'Employee ID') : null;
      let incidentRows = null;
      let incidentMap = null;
      const affectedIncidentGroups = new Set();
      if(incidentSheetName){
        incidentRows = sheetRowsToObjects(wb.Sheets[incidentSheetName], 'Incident ID');
        if(!incidentRows) throw new Error('The Incidents sheet is invalid: its Incident ID header is required. No records were changed.');
        incidentMap = parseIncidentSheet(incidentRows);
        importedIncidents = [...incidentMap.values()].reduce((sum,entries)=>sum+entries.length,0);
        if(importedIncidents!==incidentRows.length){
          throw new Error('The Incidents sheet contains invalid or incomplete incident rows. No records were changed.');
        }
        if(staffRows) affectedIncidentGroups.add('staff');
        if(workerRows) affectedIncidentGroups.add('worker');
        incidentRows.forEach(row=>{
          const group = String(row['Person Type']||'').trim().toLowerCase();
          if(group==='staff' || group==='worker') affectedIncidentGroups.add(group);
        });
        if(!affectedIncidentGroups.size){ affectedIncidentGroups.add('staff'); affectedIncidentGroups.add('worker'); }
        if(mode==='replace'){
          const atRisk = [...affectedIncidentGroups].flatMap(group=>group==='staff'?state.staffs:state.workers)
            .reduce((sum,person)=>sum+(Array.isArray(person.offenceLog)?person.offenceLog.length:0),0);
          if(atRisk){
            const confirmation = prompt(`This Replace import will replace existing active and voided incident histories for the affected personnel groups. Existing incident entries: ${atRisk}. Workbook incident entries: ${importedIncidents}. Histories omitted from the workbook will be cleared. Type REPLACE INCIDENTS to continue.`);
            if(confirmation!=='REPLACE INCIDENTS'){
              if(status) status.innerHTML = '<span>Import cancelled. Existing incident histories were not changed.</span>';
              return;
            }
          }
        }
      }

      const offSheetName = wb.SheetNames.find(n=>/offence/i.test(n));
      if(offSheetName){
        const raw = sheetRowsToObjects(wb.Sheets[offSheetName], 'Offences');
        if(raw){ const parsed = parseOffenceSheet(raw); if(parsed.length){ state.offences = parsed; importedOffences = parsed.length; } }
      }
      if(staffRows){
        const parsed = parsePeopleSheet(staffRows, true, state.staffs, mode, hasDetailedIncidents);
        if(parsed.length){ state.staffs = parsed; importedStaff = parsed.length; }
      }
      if(workerRows){
        const parsed = parsePeopleSheet(workerRows, false, state.workers, mode, hasDetailedIncidents);
        if(parsed.length){ state.workers = parsed; importedWorkers = parsed.length; }
      }

      if(incidentSheetName){
        attachImportedIncidents(incidentMap, mode, affectedIncidentGroups);
      }
      const staffThresholdSheet = wb.SheetNames.find(n=>/staff/i.test(n) && /point|threshold/i.test(n));
      if(staffThresholdSheet){
        const raw = sheetRowsToObjects(wb.Sheets[staffThresholdSheet], 'Demerit Points');
        if(raw){ const parsed=parseThresholdSheet(raw,'staff'); if(parsed.length){ state.sdp=parsed; importedThresholds+=parsed.length; } }
      }
      const workerThresholdSheet = wb.SheetNames.find(n=>/worker/i.test(n) && /point|threshold/i.test(n));
      if(workerThresholdSheet){
        const raw = sheetRowsToObjects(wb.Sheets[workerThresholdSheet], 'Demerit Points');
        if(raw){ const parsed=parseThresholdSheet(raw,'worker'); if(parsed.length){ state.wdp=parsed; importedThresholds+=parsed.length; } }
      }

      if(!importedOffences && !importedStaff && !importedWorkers && !importedIncidents && !importedThresholds && !hasDetailedIncidents){
        if(status) status.innerHTML = `<span style="color:var(--red);">Couldn't find recognizable sheets in ${esc(file.name)}. Expected headers like "Employee ID" or "Offences".</span>`;
        toast('Import failed', 'No matching sheets found', true);
        return;
      }

      // recalc actions for all people against current thresholds
      state.staffs.forEach(p=> normalizePersonRecord(p,'staff'));
      state.workers.forEach(p=> normalizePersonRecord(p,'worker'));

      state.meta.lastImport = `${file.name} — ${new Date().toLocaleString()} (${mode})`;
      const saved = await persist();
      if(!saved){
        if(!saveConflict) Object.assign(state, previousState);
        renderAll();
        if(status) status.innerHTML = saveConflict
          ? `<span style="color:var(--red);">The workbook changes remain on this screen but conflict with a newer edit. Refresh only to discard them, or reload and reapply them.</span>`
          : `<span style="color:var(--red);">The workbook was read, but its changes were not saved. No imported changes were kept.</span>`;
        return;
      }
      if(status) status.innerHTML = `<span style="color:var(--green);">Imported ${importedStaff} staff, ${importedWorkers} workers, ${importedOffences} offence rules, ${importedIncidents} incidents and ${importedThresholds} threshold bands from ${esc(file.name)}.</span>`;
      toast('Import complete', `${importedStaff} staff · ${importedWorkers} workers · ${importedIncidents} incidents`);
      renderAll();
      switchTab('data');
      renderDataTab();
    }catch(err){
      if(previousState) Object.assign(state,previousState);
      console.error(err);
      if(status) status.innerHTML = `<span style="color:var(--red);">Failed to read workbook: ${esc(err.message)}</span>`;
      toast('Import failed', err.message, true);
    }
  };
  reader.readAsArrayBuffer(file);
}

function offenceRulesExportRows(){
  return state.offences.slice().sort((a,b)=> b.points-a.points || a.offence.localeCompare(b.offence)).map(o=>({
    Severity:o.severity,
    Offences:o.offence,
    'Demerit Points':o.points,
    'Reason/Basis':o.reason||'',
  }));
}

function exportOffenceRules(format){
  if(!requireAdminAccess()) return;
  try{
    const rows = offenceRulesExportRows();
    if(!rows.length){ toast('Export unavailable', 'There are no offence rules to export.', true); return; }
    const sheet = XLSX.utils.json_to_sheet(rows);
    sheet['!cols'] = [{wch:18},{wch:64},{wch:16},{wch:78}];
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
    const baseName = `SALS-Offence-Rules-${stamp}`;

    if(format==='xlsx'){
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, sheet, 'Offences');
      XLSX.writeFile(workbook, `${baseName}.xlsx`, {compression:true});
    } else if(format==='csv'){
      const csv = '\uFEFF' + XLSX.utils.sheet_to_csv(sheet);
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${baseName}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 0);
    } else {
      throw new Error('Unsupported offence-rule export format.');
    }
    toast('Offence rules exported', `${rows.length} rules downloaded as ${format.toUpperCase()}.`);
  }catch(err){
    console.error(err);
    toast('Offence rule export failed', err.message, true);
  }
}

async function exportWorkbook(){
  if(!requireAdminAccess()) return;
  try{
    const wb = XLSX.utils.book_new();
    const offSheet = XLSX.utils.json_to_sheet(state.offences.map(o=>({
      Severity:o.severity, Offences:o.offence, 'Demerit Points':o.points, 'Reason/Basis':o.reason
    })));
    XLSX.utils.book_append_sheet(wb, offSheet, 'Offences');

    const staffRows = state.staffs.map(p=>{
      const row = { 'Record ID':p.id, 'Employee ID':p.employeeId, Agent:p.agent, Name:p.name, Designation:p.designation, Division:p.division, Status:p.status, 'Total Points':p.totalPoints, 'Demerit Point':p.demeritPoints };
      // Every active logged offence gets its own OF# column.
      (p.offenceLog||[]).filter(o=>!o.voided).forEach((o,i)=>{ row['OF'+(i+1)] = o.points; });
      row['Disciplinary Action Taken'] = p.action;
      row['Last Modified By'] = p.lastModifiedBy || '';
      row['Last Modified At'] = p.lastModifiedAt || '';
      return row;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(staffRows), 'Staffs-Records');

    const workerRows = state.workers.map(p=>{
      const row = { 'Record ID':p.id, 'Employee ID':p.employeeId, 'Passport No.':p.passportNo, Agent:p.agent, Shift:p.shift, Name:p.name, Designation:p.designation, Division:p.division, Status:p.status, 'Total Points':p.totalPoints, 'Demerit Point':p.demeritPoints };
      (p.offenceLog||[]).filter(o=>!o.voided).forEach((o,i)=>{ row['OF'+(i+1)] = o.points; });
      row['Disciplinary Action Taken'] = p.action;
      row['Last Modified By'] = p.lastModifiedBy || '';
      row['Last Modified At'] = p.lastModifiedAt || '';
      return row;
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(workerRows), 'Workers-Records');

    const incidentRows = [];
    for(const [group, records] of [['staff',state.staffs],['worker',state.workers]]){
      records.forEach(person=>{
        (person.offenceLog||[]).forEach(incident=>incidentRows.push({
          'Person Type':group,
          'Person Record ID':person.id,
          'Employee ID':person.employeeId,
          'Incident ID':incident.id||'',
          'Rule ID':incident.ruleId||'',
          'Description':incident.label||'',
          'Points':incident.points||0,
          'Occurred At':incident.date||'',
          'Logged By':incident.by||'',
          'Voided':incident.voided?'Yes':'No',
          'Voided At':incident.voidedAt||'',
          'Voided By':incident.voidedBy||'',
        }));
      });
    }
    const incidentHeaders = ['Person Type','Person Record ID','Employee ID','Incident ID','Rule ID','Description','Points','Occurred At','Logged By','Voided','Voided At','Voided By'];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(incidentRows,{header:incidentHeaders}), 'Incidents');

    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.sdp.map(r=>({ 'Demerit Points':r.band, Minimum:r.min, Maximum:r.max, Severity:r.severity, 'Staff Disciplinary Action':r.action, 'Escalation / Approval Authority':r.authority }))), 'Staffs-Point');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(state.wdp.map(r=>({ 'Demerit Points':r.band, Minimum:r.min, Maximum:r.max, Severity:r.severity, 'Workers Disciplinary Action':r.action, 'Escalation / Approval Authority':r.authority }))), 'Workers-Points');

    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
    XLSX.writeFile(wb, `SALS-Demerit-System-Live-${stamp}.xlsx`);
    state.meta.lastExport = new Date().toISOString();
    const saved = await persist();
    toast('Export ready', saved?'Workbook downloaded and backup timestamp saved.':'Workbook downloaded; the backup timestamp could not be saved.', !saved);
  }catch(err){
    console.error(err);
    toast('Export failed', err.message, true);
  }
}

document.getElementById('app').style.display = 'none';
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshSharedState(false); });
initAuth();
