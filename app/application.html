<!-- Netlify-ready static app -->
<style>
:root{
  --bg:#0f0f0f;
  --bg-grad:radial-gradient(1200px 600px at 100% -10%,#1d1715 0%,#0f0f0f 55%);
  --panel:#171717;
  --panel-2:#121212;
  --border:#303030;
  --border-soft:#242424;
  --text:#ffffff;
  --muted:#b5b5b5;
  --muted-2:#777777;
  --brand:#e8391a;
  --brand-hover:#f05233;
  --blue:#4c8dff;
  --blue-hover:#5b96ff;
  --amber:#e8a93b;
  --orange:#e8391a;
  --red:#e14b4b;
  --green:#39bf8a;
  --mono: 'Cascadia Mono', 'Segoe UI Mono', Consolas, ui-monospace, monospace;
  --disp: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --body: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-grad);
  color:var(--text);
  font-family:var(--body);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(232,57,26,.35);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#383838;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#4a4a4a;}

#app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:230px;flex:0 0 230px;
  background:linear-gradient(180deg,#141414,#0f0f0f);
  border-right:1px solid var(--border-soft);
  padding:20px 14px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:18px;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;flex:0 0 34px;
  background:var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:13px;color:#0f0f0f;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 6px 18px -6px rgba(232,57,26,.5);
}
.brand-mark span{background:#0f0f0f;color:#fff;width:100%;height:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;margin:1.5px;font-size:12px;}
.brand-text{line-height:1.15;}
.brand-text .t1{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.2px;}
.brand-text .t2{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;}
.sidebar-brand{align-items:flex-start;flex-direction:column;gap:7px;}
.sidebar-brand-logo{display:block;width:160px;max-width:100%;height:auto;object-fit:contain;}
.sidebar-brand .brand-text{width:100%;}
.sidebar-brand-row{flex:0 0 auto;}
.btn.sidebar-mobile-close{display:none;width:38px;height:38px;align-items:center;justify-content:center;flex:0 0 38px;padding:0;align-self:flex-start;}
.sidebar-mobile-close svg{width:18px;height:18px;}
.sidebar-search-wrap{position:relative;margin:2px 6px 0}.sidebar-search{display:flex;align-items:center;gap:8px;padding:10px 11px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:10px;transition:.15s}.sidebar-search:focus-within{border-color:var(--blue);background:rgba(76,141,255,.055);box-shadow:0 0 0 3px rgba(76,141,255,.13)}.sidebar-search svg{width:15px;height:15px;flex:0 0 15px;color:var(--muted)}.sidebar-search input{min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--text);font:500 12px var(--body)}.sidebar-search input::placeholder{color:var(--muted-2)}.sidebar-search-clear{display:none;width:20px;height:20px;flex:0 0 20px;align-items:center;justify-content:center;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.sidebar-search-clear:hover{background:var(--panel);color:var(--text)}.sidebar-search-clear svg{width:12px;height:12px}.sidebar-search-results{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:80;max-height:330px;overflow:auto;padding:6px;background:rgba(15,15,15,.98);border:1px solid var(--border);border-radius:11px;box-shadow:0 18px 45px rgba(0,0,0,.45);backdrop-filter:blur(16px)}.sidebar-search-results.open{display:block}.sidebar-result-group{padding:7px 8px 4px;color:var(--muted-2);font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.sidebar-result{width:100%;display:flex;align-items:flex-start;gap:9px;padding:9px 8px;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;text-align:left}.sidebar-result:hover,.sidebar-result.active{background:rgba(232,57,26,.1)}.sidebar-result-icon{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--panel);color:#9fc0ff}.sidebar-result-icon svg{width:13px;height:13px}.sidebar-result-copy{min-width:0}.sidebar-result-title{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-result-meta{display:block;margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-search-empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}


.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted-2);padding:12px 10px 6px;}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;
  color:var(--muted);background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:13px;font-weight:500;text-align:left;width:100%;
  transition:background .12s, color .12s, border-color .12s;
  font-family:var(--body);
}
.nav-btn:hover{background:var(--panel);color:var(--text);}
.nav-btn.active{background:rgba(232,57,26,.12);color:#ffe0d8;border-color:rgba(232,57,26,.32);}
.nav-btn .ic{width:16px;height:16px;flex:0 0 16px;opacity:.9;}
/* Sidebar sizing and scrolling fixes */
.sidebar{overflow:hidden;min-height:0;}
.sidebar .brand,.sidebar-search-wrap,.sidebar-foot{flex:0 0 auto;}
.sidebar .nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px;scrollbar-width:thin;scrollbar-color:#383838 transparent;}
.nav-btn>svg{width:16px!important;height:16px!important;min-width:16px;max-width:16px;flex:0 0 16px;display:block;opacity:.9;}
.nav-btn[data-tab="personnel-comments"]>span:not(.count){min-width:0;white-space:normal;line-height:1.35;}
.brand-mark{width:32px;height:32px;flex-basis:32px;}
.sidebar-foot{padding-bottom:max(10px,env(safe-area-inset-bottom));}
@media (max-height:720px){
  .sidebar{padding-top:14px;padding-bottom:12px;gap:10px;}
  .nav-label{padding-top:8px;}
  .nav-btn{padding-top:8px;padding-bottom:8px;}
  .sidebar-foot .hint{display:none;}
}

.nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-2);}
.nav-btn.active .count{color:#ffb19f;}

.sidebar-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border-soft);}
.sync-pill{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(57,191,138,.15);flex:0 0 7px;}
.dot.sync{animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:16px 26px;border-bottom:1px solid var(--border-soft);
  position:sticky;top:0;background:rgba(15,15,15,.88);backdrop-filter:blur(10px);z-index:20;
}
.topbar h1{font-family:var(--disp);font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.mobile-nav-toggle{display:none;width:38px;height:38px;align-items:center;justify-content:center;flex:0 0 38px;padding:0;}
.mobile-section-nav{display:none;}
.search{
  display:flex;align-items:center;gap:8px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:210px;
}
.search input{background:transparent;border:none;outline:none;color:var(--text);font-size:12.5px;width:100%;font-family:var(--body);}
.search svg{opacity:.5;flex:0 0 14px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:12.5px;font-weight:600;
  cursor:pointer;font-family:var(--body);white-space:nowrap;
  transition:transform .08s, border-color .12s, background .12s;
}
.btn:hover{border-color:#4a4a4a;background:#202020;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,var(--blue-hover),var(--blue));border-color:var(--blue);color:#fff;}
.btn.primary:hover{background:linear-gradient(180deg,#699dff,var(--blue-hover));}
.btn.danger{background:transparent;border-color:#4a2430;color:#f0a3a3;}
.btn.danger:hover{background:rgba(225,75,75,.1);border-color:#7a3040;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn.ghost:hover{background:var(--panel);color:var(--text);}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
.btn svg{width:14px;height:14px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
input[type=file]{display:none;}

.content{padding:22px 26px 60px;max-width:1400px;width:100%;margin:0 auto;}
.view{display:none;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* CARDS / KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px;position:relative;overflow:hidden;
}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
.kpi .val{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1;}
.kpi .val small{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:500;}
.kpi.accent-blue{border-top:2px solid var(--blue);}
.kpi.accent-amber{border-top:2px solid var(--amber);}
.kpi.accent-red{border-top:2px solid var(--red);}
.kpi.accent-green{border-top:2px solid var(--green);}
.kpi.accent-purple{border-top:2px solid #9b7bff;}

/* HERO / COMMAND CENTRE HEADER */
.cc-hero{
  background:linear-gradient(135deg,rgba(232,57,26,.12),rgba(232,57,26,0) 55%),var(--panel);
  border:1px solid var(--border);border-radius:14px;
  padding:22px 24px;margin-bottom:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  position:relative;overflow:hidden;
}
.cc-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,57,26,.2),transparent 70%);pointer-events:none;}
.cc-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.cc-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(76,141,255,.18);}
.cc-hero h2{font-family:var(--disp);font-size:24px;font-weight:700;margin:0 0 6px;letter-spacing:.2px;}
.cc-hero p{margin:0;color:var(--muted);font-size:12.5px;max-width:520px;line-height:1.5;}
.cc-hero-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}

/* STAT GRID (command-centre style) */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.stat-card .ic-wrap{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(76,141,255,.14);color:var(--blue);}
.stat-card .ic-wrap svg{width:16px;height:16px;}
.stat-card.st-amber .ic-wrap{background:rgba(232,169,59,.14);color:var(--amber);}
.stat-card.st-red .ic-wrap{background:rgba(225,75,75,.14);color:var(--red);}
.stat-card.st-purple .ic-wrap{background:rgba(155,123,255,.14);color:#9b7bff;}
.stat-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted-2);font-weight:700;}
.stat-card .val{font-family:var(--disp);font-size:28px;font-weight:700;line-height:1;}
.stat-card .foot{font-size:11px;color:var(--muted);}
.stat-card .foot b{color:var(--text);font-weight:600;}

/* PERSONNEL MIX */
.mix-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:8px;}
.mix-row .k{color:var(--muted);}
.mix-row .v{font-family:var(--mono);font-weight:700;}
.mix-track{height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--panel-2);border:1px solid var(--border-soft);margin-bottom:14px;}
.mix-track .seg{height:100%;}
.mix-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:2px;}
.mix-legend .li{display:flex;align-items:center;gap:6px;}
.mix-legend .sw{width:9px;height:9px;border-radius:3px;}
.mix-total{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.mix-total .n{font-family:var(--disp);font-size:30px;font-weight:700;}
.mix-total .u{font-size:10px;color:var(--muted-2);letter-spacing:1px;text-transform:uppercase;}

/* ACTIVITY FEED */
.feed-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.feed-row:last-child{border-bottom:none;}
.feed-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:5px;flex:0 0 7px;}
.feed-dot.hi{background:var(--red);}
.feed-body{flex:1;min-width:0;}
.feed-body .n{font-weight:600;font-size:12.5px;}
.feed-body .d{color:var(--muted);font-size:11px;margin-top:1px;}
.feed-pts{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--red);flex:0 0 auto;}

@media (max-width:1100px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }

.alert-banner{
  display:flex;align-items:flex-start;gap:12px;
  background:linear-gradient(90deg, rgba(232,169,59,.12), rgba(232,169,59,.03));
  border:1px solid rgba(232,169,59,.35);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:18px;
}
.alert-banner.ok{background:linear-gradient(90deg, rgba(57,191,138,.1), rgba(57,191,138,.02));border-color:rgba(57,191,138,.3);}
.alert-banner svg{flex:0 0 18px;margin-top:1px;color:var(--amber);}
.alert-banner.ok svg{color:var(--green);}
.alert-banner .t{font-size:12.5px;line-height:1.5;color:#e7d9bb;}
.alert-banner.ok .t{color:#c9ecdd;}
.alert-banner b{font-family:var(--disp);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.panel h3{font-family:var(--disp);font-size:13.5px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:600;letter-spacing:.2px;}
.panel h3 .tag{font-size:10px;font-family:var(--mono);color:var(--muted-2);font-weight:400;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
.bar-row .l{width:64px;flex:0 0 64px;color:var(--muted);font-family:var(--mono);font-size:11.5px;}
.bar-row .track{flex:1;height:16px;background:var(--panel-2);border-radius:5px;overflow:hidden;border:1px solid var(--border-soft);}
.bar-row .fill{height:100%;border-radius:5px 0 0 5px;transition:width .4s ease;}
.bar-row .n{width:26px;flex:0 0 26px;text-align:right;font-family:var(--mono);font-weight:600;}
.agency-workforce-row{display:grid;grid-template-columns:minmax(0,1fr) 32px;align-items:start;gap:6px 10px;margin-bottom:12px;font-size:12px;}
.agency-workforce-row:last-child{margin-bottom:0;}
.agency-workforce-name{min-width:0;color:var(--muted);line-height:1.45;overflow-wrap:anywhere;white-space:normal;}
.agency-workforce-count{text-align:right;font-family:var(--mono);font-weight:600;}
.agency-workforce-row .track{grid-column:1/-1;height:16px;background:var(--panel-2);border-radius:5px;overflow:hidden;border:1px solid var(--border-soft);}
.agency-workforce-row .fill{height:100%;border-radius:5px 0 0 5px;transition:width .4s ease;}

.sev-major{background:linear-gradient(90deg,#e14b4b,#c73434);}
.sev-minor{background:linear-gradient(90deg,#e8763b,#d9611f);}
.sev-low{background:linear-gradient(90deg,#e8a93b,#c98a1e);}
.sev-ok{background:linear-gradient(90deg,#39bf8a,#22a56f);}
.sev-info{background:linear-gradient(90deg,var(--blue-hover),var(--blue));}

/* TABLE */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
.table-toolbar .spacer{flex:1;}
.table-scroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;}
.table-scroll:focus-visible{outline:2px solid var(--blue);outline-offset:-2px;}
.table-scroll thead th{top:0;}
.table-scroll-hint{display:none;}
.chip-select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:12px;font-family:var(--body);outline:none;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;font-size:10px;letter-spacing:.7px;
  border-bottom:1px solid var(--border);background:var(--panel-2);
  position:sticky;top:57px;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr:hover{background:rgba(232,57,26,.05);}
tbody tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);}
.name-cell .n{font-weight:600;}
.name-cell .d{color:var(--muted);font-size:11px;margin-top:1px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;border:1px solid transparent;
}
.badge.major{background:rgba(225,75,75,.13);color:#ff9a9a;border-color:rgba(225,75,75,.3);}
.badge.minor{background:rgba(232,118,59,.13);color:#ffb888;border-color:rgba(232,118,59,.3);}
.badge.low{background:rgba(232,169,59,.13);color:#ffd48f;border-color:rgba(232,169,59,.3);}
.badge.ok{background:rgba(57,191,138,.12);color:#7fe0bc;border-color:rgba(57,191,138,.3);}

.pts{font-family:var(--mono);font-weight:700;font-size:13px;}
.active-cases-table tbody tr{height:52px;}
.active-cases-table .name-cell .n{font-family:var(--body);font-size:13px;font-weight:700;line-height:18px;letter-spacing:0;}
.active-cases-table .name-cell .d{font-family:var(--mono);font-size:11px;font-weight:400;line-height:15px;letter-spacing:0;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.iconbtn{

  cursor:pointer;transition:.12s;
}
.iconbtn:hover{color:var(--text);border-color:#4a4a4a;background:#202020;}
.iconbtn.del:hover{color:#ff9a9a;border-color:#7a3040;background:rgba(225,75,75,.08);}
.iconbtn svg{width:13px;height:13px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--muted);}
.empty-state svg{opacity:.35;margin-bottom:10px;}
.pager{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--muted);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(5,8,16,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.overlay.open{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  width:100%;max-width:480px;max-height:85vh;overflow:auto;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
}
.modal.wide{max-width:600px;}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-family:var(--disp);font-size:15px;margin:0;font-weight:700;}
.modal-head .btn{margin-left:auto;}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:13px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border-soft);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.field input, .field select, .field textarea{
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;color:var(--text);font-size:13px;font-family:var(--body);outline:none;
  transition:border-color .12s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:11px;color:var(--muted-2);}
.of-log{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
.of-log .row{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border-soft);padding:7px 9px;border-radius:7px;font-size:11.5px;}
.of-log .row .p{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--red);}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:#191919;border:1px solid var(--border);border-left:3px solid var(--green);
  padding:11px 15px;border-radius:9px;font-size:12.5px;min-width:240px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
  animation:slidein .25s ease;
}
.toast.err{border-left-color:var(--red);}
@keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:none;opacity:1;}}
.toast .tt{font-weight:700;margin-bottom:2px;font-family:var(--disp);}
.toast .ts{color:var(--muted);}
.feedback-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.feedback-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;}
.feedback-card.pending{border-top:2px solid var(--amber);}.feedback-card.appeal-accepted{border-top:2px solid var(--green);}.feedback-card.rejected{border-top:2px solid var(--red);}
.feedback-card .count{font:700 25px var(--disp);margin:5px 0;}.feedback-card .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;}
.feedback-list{display:flex;flex-direction:column;gap:10px;}.feedback-item{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:12px 14px;}
.feedback-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;}.feedback-head .when{margin-left:auto;color:var(--muted-2);font-size:10.5px;}
.feedback-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:12.5px;}.feedback-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
.feedback-decision{margin-top:10px;padding:10px 12px;border-left:3px solid var(--blue);border-radius:7px;background:var(--panel);}.feedback-decision.rejected{border-left-color:var(--red);}.feedback-decision.accepted{border-left-color:var(--green);}.feedback-decision-label{margin-bottom:5px;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;}
.feedback-offences{margin-top:10px;padding:10px 12px;border:1px solid var(--border-soft);border-radius:8px;background:var(--panel);}.feedback-offence-summary{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;}.feedback-offence-total{font:700 11.5px var(--mono);color:var(--amber);}.feedback-offence-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;margin-top:9px;}.feedback-offence-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:7px 9px;border:1px solid var(--border-soft);border-radius:7px;background:var(--panel-2);font-size:11.5px;}.feedback-offence-row.is-voided{opacity:.78;}.feedback-offence-name{min-width:0;overflow-wrap:anywhere;line-height:1.45;}.feedback-offence-name .badge{margin-right:5px;vertical-align:1px;}.feedback-offence-points{flex:none;font:700 11px var(--mono);color:var(--red);white-space:nowrap;}.feedback-offence-row.is-voided .feedback-offence-points{color:var(--muted);}
.feedback-recommended-action{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;margin-top:10px;padding:9px 10px;border-left:3px solid var(--blue);border-radius:7px;background:var(--panel-2);font-size:11.5px;}.feedback-recommended-action span{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}.feedback-recommended-action b{text-align:right;overflow-wrap:anywhere;}
.personnel-feedback-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}.personnel-feedback-toolbar h3{margin:0;}.personnel-feedback-toolbar .tag{margin-left:auto;text-align:right;font-size:10px;font-family:var(--mono);color:var(--muted-2);font-weight:400;}
.feedback-form textarea{min-height:120px;resize:vertical;}.role-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;}.account-card{flex-wrap:wrap;}.account-card-details{flex:1;min-width:180px;}.account-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
@media (max-width:760px){.feedback-grid{grid-template-columns:1fr;}.feedback-recommended-action{grid-template-columns:1fr;gap:4px;}.feedback-recommended-action b{text-align:left;}.account-actions{width:100%;justify-content:flex-end;}}

.import-drop{
  border:1.5px dashed var(--border);border-radius:12px;padding:26px;text-align:center;
  color:var(--muted);cursor:pointer;transition:.15s;
}
.import-drop:hover{border-color:var(--blue);background:rgba(76,141,255,.05);}
.import-drop svg{margin-bottom:8px;opacity:.7;}
.import-drop b{color:var(--text);}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:2px;}
.legend .li{display:flex;align-items:center;gap:5px;}
.legend .sw{width:9px;height:9px;border-radius:3px;}

/* PROJECT SUMMARY */
.summary-hero{align-items:center;padding:26px 28px;}
.summary-hero p{max-width:740px;font-size:13px;line-height:1.65;}
.summary-status{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid rgba(57,191,138,.3);border-radius:999px;background:rgba(57,191,138,.08);color:#9be5c8;font:600 11.5px var(--body);white-space:nowrap;}
.summary-status .dot{box-shadow:0 0 0 3px rgba(57,191,138,.13);}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px;}
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.summary-card .ic-wrap{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(76,141,255,.14);color:var(--blue);margin-bottom:13px;}
.summary-card .ic-wrap svg{width:17px;height:17px;}
.summary-card h3{margin:0 0 7px;font:600 14px var(--disp);}
.summary-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.65;}
.summary-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px;counter-reset:summary-step;}
.summary-step{position:relative;min-height:118px;padding:16px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;counter-increment:summary-step;}
.summary-step::before{content:counter(summary-step,decimal-leading-zero);display:block;margin-bottom:12px;color:var(--blue);font:600 11px var(--mono);letter-spacing:.8px;}
.summary-step b{display:block;margin-bottom:5px;font:600 12.5px var(--disp);}
.summary-step span{color:var(--muted);font-size:11.5px;line-height:1.55;}
.summary-note{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;background:linear-gradient(90deg,rgba(232,57,26,.12),rgba(232,57,26,.025));border:1px solid rgba(232,57,26,.3);border-radius:var(--radius);}
.summary-note>svg{width:18px;height:18px;flex:0 0 18px;color:#ffb19f;margin-top:1px;}
.summary-note b{display:block;margin-bottom:4px;font:600 12.5px var(--disp);}
.summary-note p{margin:0;color:var(--muted);font-size:11.8px;line-height:1.6;}

  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-3{grid-template-columns:1fr;}

}

  const baseMap=toMap(base),localMap=toMap(local),remoteMap=toMap(remote);
  if(!baseMap||!localMap||!remoteMap) return null;
  const order=[...remoteMap.keys(),...localMap.keys()].filter((key,index,keys)=>keys.indexOf(key)===index);
  const merged=[];
  for(const key of order){
    const before=baseMap.get(key),mine=localMap.get(key),theirs=remoteMap.get(key);
    const mineChanged=!sameSharedValue(mine,before);
    const theirsChanged=!sameSharedValue(theirs,before);
    if(mineChanged&&theirsChanged&&!sameSharedValue(mine,theirs)) return null;
    const selected=mineChanged?mine:theirs;
    if(selected!==undefined) merged.push(sharedClone(selected));
  }
  return merged;
}

function captureSharedState(){
  return {
    offences:sharedClone(state.offences),staffs:sharedClone(state.staffs),workers:sharedClone(state.workers),
    sdp:sharedClone(state.sdp),wdp:sharedClone(state.wdp),meta:sharedClone(state.meta),
  };
}

function rebaseSharedChanges(remoteState,keys){
  if(!remoteState||typeof remoteState!=='object'||!lastSyncedState) return false;
  const mergedGroups={};
  for(const key of keys){
    const before=lastSyncedState[key],mine=state[key],theirs=remoteState[key];
    if(sameSharedValue(theirs,before)) mergedGroups[key]=sharedClone(mine);
    else if(sameSharedValue(mine,before)) mergedGroups[key]=sharedClone(theirs);
    else {
      const merged=threeWayMergeRecordGroup(before,mine,theirs);
      if(!merged) return false;
      mergedGroups[key]=merged;
    }
  }
  const remoteMeta=remoteState.meta&&typeof remoteState.meta==='object'?remoteState.meta:{};
  const localMeta=state.meta&&typeof state.meta==='object'?state.meta:{};
  const baseMeta=lastSyncedState.meta&&typeof lastSyncedState.meta==='object'?lastSyncedState.meta:{};
  const mergedMeta={...remoteMeta};
  const metaKeys=new Set([...Object.keys(baseMeta),...Object.keys(localMeta),...Object.keys(remoteMeta)]);
  for(const key of metaKeys){
    if(key==='lastUpdated'||key==='lastModifiedBy') continue;
    const before=baseMeta[key],mine=localMeta[key],theirs=remoteMeta[key];
    const mineChanged=!sameSharedValue(mine,before);
    const theirsChanged=!sameSharedValue(theirs,before);
    if(mineChanged&&theirsChanged&&!sameSharedValue(mine,theirs)) return false;
    if(mineChanged){
      if(mine===undefined) delete mergedMeta[key];
      else mergedMeta[key]=sharedClone(mine);
    }
  }
  for(const key of SHARED_GROUP_KEYS){
    if(Object.hasOwn(mergedGroups,key)) state[key]=mergedGroups[key];
    else if(Array.isArray(remoteState[key])) state[key]=sharedClone(remoteState[key]);
  }
  state.meta=mergedMeta;
  lastSyncedState={
    offences:sharedClone(remoteState.offences),staffs:sharedClone(remoteState.staffs),workers:sharedClone(remoteState.workers),
    sdp:sharedClone(remoteState.sdp),wdp:sharedClone(remoteState.wdp),meta:sharedClone(remoteMeta),
  };
  return true;
}

function queueSave(key){
  if(!requireAdminAccess()) return;
  if(!SHARED_GROUP_KEYS.includes(key)) return;
  pendingSaveKeys.add(key);
  if(saveConflict){ toast('Unsaved change preserved', 'This section still conflicts with a newer edit. Refresh to discard it, or reload and reapply it.', true); return; }
  clearTimeout(saveTimer);
  markSyncing(true);
  saveTimer = setTimeout(flushPendingSaves,260);
}

async function flushPendingSaves(){
  saveTimer=null;
  if(saveConflict||!pendingSaveKeys.size){ markSyncing(false); return false; }
  const keys=[...pendingSaveKeys];
  pendingSaveKeys.clear();
  const saved=await persist(keys);
  if(!saved) keys.forEach(key=>pendingSaveKeys.add(key));
  if(saved&&pendingSaveKeys.size){
    markSyncing(true);
    saveTimer=setTimeout(flushPendingSaves,260);
  }
  return saved;
}

async function fetchLatestStateForRebase(keys){
  try{
    const response=await fetch('/api/state',{credentials:'same-origin',cache:'no-store'});
    if(response.status===401||response.status===403){
      state.currentUser=null;
      renderLogin('Your administrator session expired. Please sign in again.');
      return false;
    }
    const remote=await response.json();
    if(!response.ok||!remote.state||!Number.isSafeInteger(remote.revision)) return false;
    if(!rebaseSharedChanges(remote.state,keys)) return false;
    currentRevision=remote.revision;
    latestRemoteUpdate=remote.lastUpdated||latestRemoteUpdate;
    return true;
  }catch(error){
    console.warn('Unable to merge concurrent shared changes',error);
    return false;
  }
}

async function saveGroups(keys,allowRebase){
  const savedGroups=Object.fromEntries(keys.map(key=>[key,sharedClone(state[key])]));
  const savedMeta=sharedClone(state.meta);
  const payload={...savedGroups,meta:savedMeta};
  const response = await fetch('/api/state', {
    method: 'PUT',
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ state: payload, revision: currentRevision }),
  });
  const result = await response.json();
  if(response.status===401 || response.status===403){
    state.currentUser = null;
    renderLogin('Your administrator session expired. Please sign in again.');
    return false;
  }
  if(response.status===409){
    const rebaseKeys=[...new Set([...keys,...pendingSaveKeys])];
    if(allowRebase&&await fetchLatestStateForRebase(rebaseKeys)){
      const saved=await saveGroups(rebaseKeys,false);
      if(saved){ renderAll(); toast('Changes synchronized','Concurrent edits to different records were merged safely.'); }
      return saved;
    }
    saveConflict = true;
    keys.forEach(key=>pendingSaveKeys.add(key));
    toast('Save conflict', 'Another update was saved first and could not be merged automatically. Your changes are preserved; refresh only to discard them.', true);
    return false;
  }
  if(!response.ok) throw new Error(result.error || 'Unable to save shared records');
  currentRevision = result.revision;
  latestRemoteUpdate = result.lastUpdated;
  state.meta.lastUpdated = result.lastUpdated;
  state.meta.lastModifiedBy = currentUser()?.username || state.meta.lastModifiedBy;
  if(!lastSyncedState) lastSyncedState=captureSharedState();
  keys.forEach(key=>{
    lastSyncedState[key]=sharedClone(savedGroups[key]);
    if(pendingSaveKeys.has(key)&&sameSharedValue(state[key],savedGroups[key])) pendingSaveKeys.delete(key);
  });
  lastSyncedState.meta={
    ...savedMeta,
    lastUpdated:result.lastUpdated,
    lastModifiedBy:currentUser()?.username||savedMeta.lastModifiedBy,
  };
  saveConflict=false;
  return true;
}

async function performSave(keys){
  if(!isAdministrator()) return false;
  if(!Number.isSafeInteger(currentRevision) || currentRevision < 1){
    toast('Save unavailable', 'The current record revision is missing. Refresh and try again.', true);
    return false;
  }
  saveInFlight = true;
  try{
    return await saveGroups(keys,true);
  }catch(e){
    console.error('Storage save failed', e);
    toast('Save failed', e.message, true);
    return false;
  }finally{
    saveInFlight = false;
    if(!pendingSaveKeys.size) markSyncing(false);
  }
}

function persist(key){
  const requested=Array.isArray(key)?key:(key?[key]:SHARED_GROUP_KEYS);
  const keys=[...new Set(requested.filter(item=>SHARED_GROUP_KEYS.includes(item)))];
  const task=saveChain.then(()=>performSave(keys),()=>performSave(keys));
  saveChain=task.catch(()=>false);
  return task;
}

async function refreshFeedback(render){

async function refreshSharedState(manual, quiet=false){
  const hasUnsavedChanges=saveConflict||pendingSaveKeys.size>0;
  if(hasUnsavedChanges && !manual) return;
  if(hasUnsavedChanges && manual){
    const warning=saveConflict
      ? 'Refreshing will discard your unsaved conflicting changes and load the latest shared records. Continue?'
      : 'Some changes have not been saved yet. Refreshing now will discard them. Continue?';
    if(!confirm(warning)) return false;
    clearTimeout(saveTimer);
    saveTimer=null;
    pendingSaveKeys.clear();
    saveConflict=false;
    markSyncing(false);
  }
  if(!state.currentUser || saveTimer || saveInFlight || document.hidden) return;
  const overlay = document.getElementById('overlay');
  if(overlay && overlay.classList.contains('open')) return;

  try{
    const since = currentRevision ? '?revision='+encodeURIComponent(currentRevision) : '';
    const response = await fetch('/api/state'+since, { credentials:'same-origin', cache:'no-store' });
    if(response.status === 401){ state.currentUser = null; renderLogin('Your session expired. Please sign in again.'); return; }
    const remote = await response.json();
    if(!response.ok) throw new Error(remote.error || 'Unable to refresh shared records');
    if(isAdministrator() && remote.access!=='admin'){
      state.currentUser = null;
      renderLogin('Your administrator session expired. Please sign in again.');
      return;
    }
    if(remote.unchanged){ if(manual) toast('Dashboard refreshed', 'Shared records are up to date.'); return; }

    const latest = remote.state || {};
    for(const key of ['offences','staffs','workers','sdp','wdp']){
      if(Array.isArray(latest[key])) state[key] = latest[key];
    }
    if(latest.meta && typeof latest.meta === 'object') state.meta = latest.meta;
    currentRevision = remote.revision || currentRevision;
    latestRemoteUpdate = remote.lastUpdated || latestRemoteUpdate;
    lastSyncedState = captureSharedState();
    saveConflict = false;
    startLiveUpdates();
    renderAll();
    if(!quiet) toast(manual ? 'Dashboard refreshed' : 'Records updated', manual ? 'Latest shared records loaded.' : 'Changes from another authorized device are now visible.');
  }catch(error){
    console.warn('Unable to refresh shared records', error);
    if(manual) toast('Refresh failed', error.message || 'Please try again.', true);
  }
}

function startLiveUpdates(){
  if(remoteRefreshTimer) clearInterval(remoteRefreshTimer);
  remoteRefreshTimer = setInterval(()=>{ refreshSharedState(false); refreshFeedback(false); }, 12000);
}

async function boot(){
  let remote;
  try{
    const response = await fetch('/api/state', { credentials: 'same-origin', cache: 'no-store' });
    remote = await response.json();
    if(!response.ok) throw new Error(remote.error || 'Unable to load shared records');
  }catch(error){
    renderLogin(error.message || 'Unable to connect to the shared records service.');
    return;
  }
  if(isAdministrator() && remote.access!=='admin'){
    state.currentUser = null;
    renderLogin('Your administrator session expired. Please sign in again.');
    return;
  }
  const { offences, staffs, workers, sdp, wdp, meta } = remote.state || {};
  latestRemoteUpdate = remote.lastUpdated || null;
  currentRevision = remote.revision || 0;
  const bundledVersion = SEED.seedVersion || null;
  const savedVersion = meta && meta.seedVersion;
  const ruleLibraryStale = !!bundledVersion && !!savedVersion && savedVersion !== bundledVersion;

  state.offences = offences || SEED.offences;
  state.staffs = staffs || [];
  state.workers = workers || [];
  state.sdp = sdp || SEED.sdp;
  state.wdp = wdp || SEED.wdp;
  state.meta = meta || { lastUpdated: null, lastImport: 'Seeded from OE-SEC9-DMS-01_-_Demerit_System.xlsx', lastExport: null };
  if(state.meta.lastExport === undefined) state.meta.lastExport = null;
  if(!state.meta.seedVersion) state.meta.seedVersion = bundledVersion;
  state.staffs.forEach(p=>normalizePersonRecord(p, 'staff'));
  state.workers.forEach(p=>normalizePersonRecord(p, 'worker'));
  lastSyncedState = captureSharedState();
  if(isAdministrator() && (!offences || !staffs || !workers || !sdp || !wdp)){
    await persist();
  }
  await refreshFeedback(false);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  renderShell();
  renderAll();
  startLiveUpdates();
  if(ruleLibraryStale && isAdministrator()){
    toast('Policy update available', 'Existing customized rules were preserved. Import or review the new policy explicitly before replacing them.');
  }
}

/* ---------- helpers ---------- */
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8).toUpperCase(); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleString(undefined,{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function todayISODate(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function daysSinceBackup(){
  if(!state.meta.lastExport) return Infinity;
  return (Date.now() - new Date(state.meta.lastExport).getTime()) / 86400000;
}
function backupBannerHtml(){
  if(!isAdministrator()) return '';
  const days = daysSinceBackup();
  if(!isFinite(days)){
    return `<div class="backup-banner">${ICONS.alert}<div>No Excel backup is on record yet. Shared records are stored online, but an exported workbook is recommended for reporting and recovery.</div></div>`;
  }
  if(days >= 7){
    return `<div class="backup-banner">${ICONS.alert}<div>Last backup was ${Math.floor(days)} day${Math.floor(days)===1?'':'s'} ago. Consider exporting an updated workbook from <b>Import / Export</b>.</div></div>`;
  }
  return '';
}

function severityClass(sev){
  if(!sev) return 'ok';
  const s = sev.toLowerCase();
  if(s.includes('major')) return 'major';
  if(s.includes('minor')) return 'minor';
  if(s.includes('low')) return 'low';
  return 'ok';
}

function thresholdTable(group){ return group === 'staff' ? state.sdp : state.wdp; }

function tierFor(points, group){
  const table = thresholdTable(group);
  const sorted = [...table].sort((a,b)=> (b.min||0)-(a.min||0));
  for(const row of sorted){
    if(points >= (row.min||0) && points <= (row.max||999)) return row;
  }
  return null;
}

function activeBand(points){
  if(points>=70) return '70+';
  if(points>=61) return '61-69';
  if(points>=51) return '51-60';
  if(points>=41) return '41-50';
  if(points>=21) return '21-40';
  if(points>=15) return '15-20';
  return null;
}

function recalcAction(p, group){
  const tier = tierFor(p.demeritPoints, group);
  p.action = p.demeritPoints > 0 ? (tier ? tier.action : 'No Disciplinary Action') : 'No Disciplinary Action';
  p.totalPoints = clamp(100 - p.demeritPoints, 0, 100);
}

// Recomputes demeritPoints from active offence entries so the total always matches the record.
function recalcPointsFromLog(p, group){
  const total = (p.offenceLog||[]).reduce((s,o)=> s + (o.voided ? 0 : (o.points||0)), 0);
  p.demeritPoints = clamp(total, 0, 100);
  recalcAction(p, group);
}

function normalizePersonRecord(p, group){
  p.employeeId = String(p.employeeId ?? '').trim();
  if(group==='worker') p.passportNo = String(p.passportNo ?? '').trim();
  p.offenceLog = Array.isArray(p.offenceLog) ? p.offenceLog : [];
  p.offenceLog.forEach(o=>{
    if(!o.id) o.id = uid('INC');
    if(o.voided===undefined) o.voided = false;
  });
  const loggedPoints = clamp(p.offenceLog.reduce((sum,o)=>sum+(o.voided?0:(Number(o.points)||0)),0),0,100);
  const recordedPoints = clamp(Number(p.demeritPoints)||0,0,100);
  if(recordedPoints > loggedPoints){
    p.offenceLog.push({
      id:uid('INC'),
      label:'Imported baseline adjustment',
      points:recordedPoints-loggedPoints,
      by:'legacy import',
      voided:false,
    });
  }
  recalcPointsFromLog(p, group);
}

function allPeople(){
  return [
    ...state.staffs.map(p=>({...p, group:'staff'})),
    ...state.workers.map(p=>({...p, group:'worker'})),
  ];
}

function findPerson(id){
  let p = state.staffs.find(x=>x.id===id);
  if(p) return {p, group:'staff', arr: state.staffs};
  p = state.workers.find(x=>x.id===id);
  if(p) return {p, group:'worker', arr: state.workers};
  return null;
}

function setupSidebarSearch(){
  const input=document.getElementById('sidebar-global-search'), results=document.getElementById('sidebar-search-results'), clear=document.getElementById('sidebar-search-clear'), wrap=document.getElementById('sidebar-search-wrap');
  if(!input||!results||!clear||!wrap)return;
  let matches=[],activeIndex=-1;
  const close=()=>{results.classList.remove('open');activeIndex=-1};
  const render=()=>{
    const q=input.value.toLowerCase().trim(); clear.style.display=q?'inline-flex':'none';
    if(!q){results.innerHTML='';close();return}
    const staff=state.staffs.filter(p=>[p.employeeId,p.name,p.agent,p.division,p.designation].join(' ').toLowerCase().includes(q)).slice(0,5).map(p=>({type:'staff',id:p.id,title:p.name,meta:[p.employeeId,p.designation,p.division].filter(Boolean).join(' · ')}));
    const workers=state.workers.filter(p=>[p.employeeId,p.name,p.agent,p.division,p.designation,p.passportNo].join(' ').toLowerCase().includes(q)).slice(0,5).map(p=>({type:'worker',id:p.id,title:p.name,meta:[p.employeeId,p.designation,p.agent].filter(Boolean).join(' · ')}));
    const offences=state.offences.filter(o=>[o.id,o.offence,o.severity,o.reason].join(' ').toLowerCase().includes(q)).slice(0,5).map(o=>({type:'offence',id:o.id,title:o.offence,meta:o.severity+' · '+o.points+' points'}));
    matches=[...staff,...workers,...offences];activeIndex=-1;
    if(!matches.length){results.innerHTML='<div class="sidebar-search-empty">No staff, worker, or offence matches found.</div>';results.classList.add('open');return}
    const groups=[['staff','Staff',ICONS.staff],['worker','Workers',ICONS.worker],['offence','Offence rules',ICONS.rules]];
    results.innerHTML=groups.map(([type,label,icon])=>{const items=matches.filter(m=>m.type===type);if(!items.length)return '';return `<div class="sidebar-result-group">${label}</div>`+items.map(item=>{const i=matches.indexOf(item);return `<button class="sidebar-result" type="button" role="option" data-result-index="${i}"><span class="sidebar-result-icon">${icon}</span><span class="sidebar-result-copy"><span class="sidebar-result-title">${esc(item.title)}</span><span class="sidebar-result-meta">${esc(item.meta)}</span></span></button>`}).join('')}).join('');results.classList.add('open');
  };
  const open=item=>{if(!item)return;input.value='';clear.style.display='none';close();if(item.type==='staff'){switchTab('staffs');setTimeout(()=>openPersonModal(item.id,'staff'),30)}else if(item.type==='worker'){switchTab('workers');setTimeout(()=>openPersonModal(item.id,'worker'),30)}else{switchTab('offences');setTimeout(()=>openRuleModal(item.id),30)}};
  input.addEventListener('input',render);input.addEventListener('focus',()=>{if(input.value.trim())render()});clear.addEventListener('click',()=>{input.value='';render();input.focus()});
  results.addEventListener('click',e=>{const b=e.target.closest('[data-result-index]');if(b)open(matches[+b.dataset.resultIndex])});
  input.addEventListener('keydown',e=>{const bs=[...results.querySelectorAll('.sidebar-result')];if(e.key==='ArrowDown'&&bs.length){e.preventDefault();activeIndex=(activeIndex+1)%bs.length}else if(e.key==='ArrowUp'&&bs.length){e.preventDefault();activeIndex=(activeIndex-1+bs.length)%bs.length}else if(e.key==='Enter'&&activeIndex>=0){e.preventDefault();open(matches[+bs[activeIndex].dataset.resultIndex]);return}else if(e.key==='Escape'){close();return}else return;bs.forEach((b,i)=>b.classList.toggle('active',i===activeIndex));bs[activeIndex].scrollIntoView({block:'nearest'})});
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))close()});
}

function switchTab(tab){
  if(tab==='users' && !canManageAccounts()) tab='dashboard';
  state.tab = tab;
  document.querySelectorAll('.nav-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
  const mobileSection = document.getElementById('mobile-section-select');
  if(mobileSection) mobileSection.value = tab;
  document.querySelectorAll('.view').forEach(v=> v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  const [t,s] = TITLES[tab];
  document.getElementById('view-title').textContent = t;
  document.getElementById('view-sub').textContent = s;
  renderTopbarActions();
  renderView(tab);
  document.getElementById('sidebar').classList.remove('open');
  const menuBtn = document.getElementById('mobile-nav-toggle');
  if(menuBtn) menuBtn.setAttribute('aria-expanded', 'false');
}

function updateFeedbackCount(){
  const el = document.getElementById('nav-count-feedback');
  if(!el) return;
  const complaints=state.feedback.filter(item=>!item.subjectPersonId);
  if(isAdministrator()) el.textContent = complaints.filter(item=>item.status==='pending').length || '';
  else if(isStandardUser()) el.textContent = complaints.filter(item=>item.submittedBy===currentUser()?.username && item.status==='pending').length || '';
  else el.textContent = '';

  if(personnelCount){
    personnelCount.textContent=state.feedback.filter(item=>item.subjectPersonId && item.status==='pending').length || '';
  }
}

function feedbackStatusClass(status){ return status==='appeal_accepted'?'ok':status==='reviewed'?'inactive':status==='rejected'?'major':'low'; }
function feedbackStatusLabel(status){ return status==='appeal_accepted'?'Appeal Accepted':status==='reviewed'?'Reviewed':status==='rejected'?'Rejected':'Pending'; }
function moderationPrompt(status){ return status==='rejected'?'Reject this appeal?':'Mark this submission as reviewed?'; }
function moderationResultLabel(status){ return status==='appeal_accepted'?'Appeal accepted':status==='rejected'?'Appeal rejected':'Submission reviewed'; }

async function moderateSubmission(button, reopenPerson){
  const status = button.dataset.moderateStatus;
  if(status==='appeal_accepted'){
    openAppealResolutionModal(button.dataset.moderateId, reopenPerson);
    return;
  }
  if(status==='rejected'){
    openAppealRejectionModal(button.dataset.moderateId, reopenPerson);
    return;
  }
  if(!confirm(moderationPrompt(status))) return;
  button.disabled = true;
  try{
    const response = await fetch('/api/feedback', {
      method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:button.dataset.moderateId,status}),
    });
    const result = await response.json();
    if(!response.ok) throw new Error(result.error || 'Unable to moderate feedback');
    await refreshFeedback(!reopenPerson);
    if(reopenPerson) openPersonModal(reopenPerson.id, reopenPerson.group);
    toast(moderationResultLabel(status), 'The updated status is displayed on the Dashboard.');
  }catch(error){ toast('Moderation failed', error.message, true); button.disabled=false; }
}

function openAppealRejectionModal(appealId, reopenPerson){
  if(!requireAdminAccess()) return;
  const appeal = state.feedback.find(item=>item.id===appealId && item.type==='appeal' && (item.status==='pending' || item.status==='appeal_accepted'));
  if(!appeal){ toast('Appeal unavailable', 'This appeal cannot be changed or could not be found.', true); return; }
  const wasAccepted=appeal.status==='appeal_accepted';
  openModal(`
    <div class="modal-head"><h3>${wasAccepted?'Change accepted appeal to rejected':'Reject appeal'}</h3><button class="btn ghost sm" id="appeal-reject-close">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="hint" style="line-height:1.6;">${wasAccepted?'Changing this accepted appeal to rejected automatically restores the offences and demerit points reversed by the original decision, recalculates disciplinary action, and marks every offence in this appeal as rejected.':'Rejecting this appeal keeps every active offence and its points in force, and records each offence as rejected.'} The new administrator comment will remain visible with the appeal decision.</div>
      <div class="field"><label>Appeal details</label><div class="feedback-body">${esc(appeal.body)}</div></div>
      ${wasAccepted&&appeal.actionComment?`<div class="field"><label>Previous accepted decision</label><div class="feedback-body">${esc(appeal.actionComment)}</div></div>`:''}
      <div class="field"><label for="appeal-reject-comment">Action taken / administrator comment <span class="hint" style="text-transform:none;font-weight:400;">required</span></label><textarea id="appeal-reject-comment" maxlength="2000" placeholder="Explain the decision, action taken, and any required follow-up…" style="min-height:110px;resize:vertical;"></textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" id="appeal-reject-cancel">Cancel</button><button class="btn danger" id="appeal-reject-confirm" disabled>${wasAccepted?'Reject & restore points':'Reject appeal'}</button></div>
  `, true);
  const comment = document.getElementById('appeal-reject-comment');
  const confirmButton = document.getElementById('appeal-reject-confirm');
  comment.addEventListener('input',()=>{ confirmButton.disabled=comment.value.trim().length<5; });
  document.getElementById('appeal-reject-close').addEventListener('click',closeModal);
  document.getElementById('appeal-reject-cancel').addEventListener('click',closeModal);
  confirmButton.addEventListener('click',async ()=>{
    const actionComment=comment.value.trim();
    if(actionComment.length<5){ toast('Action comment required','Describe the reason or action taken in at least 5 characters.',true); return; }
    confirmButton.disabled=true;
    try{
      const response=await fetch('/api/feedback',{
        method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:appealId,status:'rejected',actionComment,reconsiderAccepted:wasAccepted}),
      });
      const result=await response.json();
      if(!response.ok) throw new Error(result.error || 'Unable to reject the appeal');
      closeModal();
      if(wasAccepted) await refreshSharedState(true,true);
      await refreshFeedback(!reopenPerson);
      if(reopenPerson) openPersonModal(reopenPerson.id,reopenPerson.group);
      const rejectedCount=(result.item?.appealDecisions||[]).filter(decision=>decision.outcome==='rejected').length;
      toast('Appeal rejected',wasAccepted?`${result.restoredPoints} demerit point${result.restoredPoints===1?'':'s'} restored; ${rejectedCount} offence${rejectedCount===1?'':'s'} recorded as rejected.`:`${rejectedCount} offence${rejectedCount===1?'':'s'} recorded as rejected; all points remain active.`);
    }catch(error){ toast('Appeal could not be rejected',error.message,true); confirmButton.disabled=false; }
  });
}

function openAppealResolutionModal(appealId, reopenPerson){
  if(!requireAdminAccess()) return;
  const appeal = state.feedback.find(item=>item.id===appealId && item.type==='appeal' && (item.status==='pending' || item.status==='rejected'));
  if(!appeal){ toast('Appeal unavailable', 'This appeal cannot be accepted or could not be found.', true); return; }
  const wasRejected=appeal.status==='rejected';
  const linked = appeal.subjectPersonId ? findPerson(appeal.subjectPersonId) : null;
  if(appeal.subjectPersonId && (!linked || linked.group!==appeal.subjectGroup)){
    toast('Personnel record unavailable', 'The person linked to this appeal no longer exists.', true);
    return;
  }
  const options = allPeople()
    .filter(person=>(person.offenceLog||[]).some(incident=>!incident.voided))
    .sort((left,right)=>(left.name||'').localeCompare(right.name||''));
  const selectedKey = linked ? `${linked.group}:${linked.p.id}` : '';

  openModal(`
    <div class="modal-head"><h3>${wasRejected?'Accept rejected appeal and reverse points':'Accept appeal and reverse points'}</h3><button class="btn ghost sm" id="appeal-close">${ICONS.x}</button></div>
    <div class="modal-body">
      <div class="hint" style="line-height:1.6;">${wasRejected?'Changing this rejected appeal to accepted':'Accepting this appeal'} immediately voids only the selected active offences and recalculates the person's points and disciplinary action. Every unselected active offence remains in force and is recorded as rejected.</div>
      <div class="field"><label>Appeal details</label><div class="feedback-body">${esc(appeal.body)}</div></div>
      ${wasRejected&&appeal.actionComment?`<div class="field"><label>Previous rejected decision</label><div class="feedback-body">${esc(appeal.actionComment)}</div></div>`:''}
      <div class="field"><label for="appeal-person">Personnel record</label>
        <select id="appeal-person" ${linked?'disabled':''}>
          <option value="">Select the staff or worker record…</option>
          ${options.map(person=>`<option value="${esc(`${person.group}:${person.id}`)}" ${`${person.group}:${person.id}`===selectedKey?'selected':''}>${esc(person.name)} · ${esc(person.employeeId||'No ID')} · ${person.group==='staff'?'Staff':'Worker'} · ${person.demeritPoints} pts</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Offence Decisions <span class="hint" style="text-transform:none;font-weight:400;">select accepted offences; unselected offences are rejected</span></label><div class="of-log" id="appeal-incidents" style="max-height:220px;"></div></div>
      <div class="field"><label for="appeal-action-comment">Action taken / administrator comment <span class="hint" style="text-transform:none;font-weight:400;">required</span></label><textarea id="appeal-action-comment" maxlength="2000" placeholder="Explain why the appeal is accepted and describe the action taken…" style="min-height:95px;resize:vertical;"></textarea></div>
      <div class="hint" id="appeal-preview" style="line-height:1.6;"></div>
    </div>
    <div class="modal-foot"><button class="btn" id="appeal-cancel">Cancel</button><button class="btn primary" id="appeal-confirm" disabled>${wasRejected?'Accept rejected appeal & reverse points':'Accept appeal & reverse points'}</button></div>
  `, true);

  const select = document.getElementById('appeal-person');
  const list = document.getElementById('appeal-incidents');
  const actionComment = document.getElementById('appeal-action-comment');
  const preview = document.getElementById('appeal-preview');
  const confirmButton = document.getElementById('appeal-confirm');
  const currentSelection = ()=>{
    const separator = select.value.indexOf(':');
    if(separator<0) return null;
    const group = select.value.slice(0,separator);
    const personId = select.value.slice(separator+1);
    const found = findPerson(personId);
    return found && found.group===group ? found : null;
  };
  const updatePreview = ()=>{
    const selected = [...list.querySelectorAll('input[data-appeal-incident]:checked')];
    const found = currentSelection();
    if(!found || !selected.length || actionComment.value.trim().length<5){
      confirmButton.disabled = true;
      preview.textContent = !found
        ? 'Choose the personnel record affected by this appeal.'
        : !selected.length
          ? 'Select at least one active offence before this appeal can be accepted.'
          : 'Describe the action taken in at least 5 characters before accepting the appeal.';
      return;
    }
    const points = selected.reduce((sum,input)=>sum+(Number(input.dataset.points)||0),0);
    const totalActive = list.querySelectorAll('input[data-appeal-incident]').length;
    const rejectedCount = totalActive-selected.length;
    const selectedIds = new Set(selected.map(input=>input.dataset.appealIncident));
    const nextPoints = clamp((found.p.offenceLog||[]).reduce((sum,incident)=>
      sum+(incident.voided || selectedIds.has(incident.id)?0:(Number(incident.points)||0)),0),0,100);
    const tier = tierFor(nextPoints,found.group);
    const action = nextPoints>0 && tier ? tier.action : 'No Disciplinary Action';
    preview.innerHTML = `<b>${selected.length} accepted · ${rejectedCount} rejected</b><br>${points} point${points===1?'':'s'} reversed · ${found.p.demeritPoints} → ${nextPoints} points · ${esc(action)}`;
    confirmButton.disabled = false;
  };
  const renderIncidents = ()=>{
    const found = currentSelection();
    const active = found ? (found.p.offenceLog||[]).filter(incident=>!incident.voided) : [];
    list.innerHTML = active.length ? active.map(incident=>`
      <label class="row" style="cursor:pointer;text-transform:none;letter-spacing:0;">
        <input type="checkbox" data-appeal-incident="${esc(incident.id)}" data-points="${incident.points}" style="width:auto;margin:0;"/>
        <span>${esc(incident.label)}<span class="of-meta" style="display:block;">${incident.date?fmtDate(incident.date):'Date not recorded'} · logged by ${esc(incident.by||'legacy import')}</span></span>
        <span class="p">+${incident.points}</span>
      </label>`).join('') : '<div class="hint">No active offences are available for this personnel record.</div>';
    list.querySelectorAll('[data-appeal-incident]').forEach(input=>input.addEventListener('change',updatePreview));
    updatePreview();
  };
  select.addEventListener('change',renderIncidents);
  actionComment.addEventListener('input',updatePreview);
  document.getElementById('appeal-close').addEventListener('click',closeModal);
  document.getElementById('appeal-cancel').addEventListener('click',closeModal);
  confirmButton.addEventListener('click',async ()=>{
    const found = currentSelection();
    const incidentIds = [...list.querySelectorAll('input[data-appeal-incident]:checked')].map(input=>input.dataset.appealIncident);
    const comment = actionComment.value.trim();
    if(!found || !incidentIds.length || comment.length<5){ updatePreview(); return; }
    confirmButton.disabled = true;
    try{
      const response = await fetch('/api/feedback',{
        method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({id:appealId,status:'appeal_accepted',subjectPersonId:found.p.id,subjectGroup:found.group,incidentIds,actionComment:comment,reconsiderRejected:wasRejected}),
      });
      const result = await response.json();
      if(!response.ok) throw new Error(result.error || 'Unable to accept the appeal and reverse its points');
      closeModal();
      await refreshSharedState(true,true);
      await refreshFeedback(true);
      if(reopenPerson) openPersonModal(reopenPerson.id,reopenPerson.group);
      toast('Offence decisions saved',`${result.reversedCount} accepted · ${result.rejectedCount} rejected · ${result.reversedPoints} demerit point${result.reversedPoints===1?'':'s'} reversed.`);
    }catch(error){ toast('Appeal could not be accepted',error.message,true); confirmButton.disabled=false; }
  });
  renderIncidents();
}

function offenceAppealOutcome(item, offence){
  if(item?.type!=='appeal') return '';
  const explicit=(item.appealDecisions||[]).find(decision=>decision.incidentId===offence.id);
  if(explicit) return explicit.outcome;
  if(item.status==='pending'&&!offence.voided) return 'pending';
  if(item.status==='rejected'&&!offence.voided) return 'rejected';
  if(item.status==='appeal_accepted'){
    if(item.moderatedAt&&item.moderatedBy&&offence.voided&&offence.voidedAt===item.moderatedAt&&offence.voidedBy===item.moderatedBy) return 'appeal_accepted';
    if(!offence.voided) return 'rejected';
  }
  return '';
}

function offenceAppealBadge(outcome){
  if(outcome==='appeal_accepted') return '<span class="badge ok">APPEAL ACCEPTED</span>';
  if(outcome==='rejected') return '<span class="badge major">REJECTED</span>';
  if(outcome==='pending') return '<span class="badge low">PENDING</span>';
  return '';
}

function appealDecisionSummaryHtml(item){
  const decisions=Array.isArray(item.appealDecisions)?item.appealDecisions:[];
  if(!decisions.length) return '';
  const accepted=decisions.filter(decision=>decision.outcome==='appeal_accepted').length;
  const rejected=decisions.filter(decision=>decision.outcome==='rejected').length;
  return `<span class="badge inactive">${accepted} Accepted · ${rejected} Rejected</span>`;
}

function personnelOffenceDetailsHtml(subject, item){
  if(!subject?.p) return '<div class="feedback-offences"><div class="hint">The linked personnel record is no longer available.</div></div>';

  const offences=Array.isArray(person.offenceLog)?person.offenceLog:[];
  const activeCount=offences.filter(offence=>!offence.voided).length;
  return `<div class="feedback-offences">
    <div class="feedback-offence-summary"><b>${subject.group==='staff'?'Staff':'Worker'} · ${esc(person.name||'Unnamed record')}</b><span class="feedback-offence-total">${Number(person.demeritPoints)||0} active pts</span></div>
