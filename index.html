<!-- Netlify-ready static app -->
<style>
:root{
  --bg:#0a0f1c;
  --bg-grad: radial-gradient(1200px 600px at 100% -10%, #0f1c33 0%, #0a0f1c 55%);
  --panel:#111a2e;
  --panel-2:#0d1526;
  --border:#1f2c47;
  --border-soft:#182338;
  --text:#e7ecf5;
  --muted:#8b9ab3;
  --muted-2:#5d6c85;
  --amber:#e8a93b;
  --orange:#e8763b;
  --red:#e14b4b;
  --green:#39bf8a;
  --blue:#4c8dff;
  --mono: 'Cascadia Mono', 'Segoe UI Mono', Consolas, ui-monospace, monospace;
  --disp: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --body: 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
  --radius: 10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg-grad);
  color:var(--text);
  font-family:var(--body);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
::selection{background:rgba(76,141,255,.35);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#233251;border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:#2c3d61;}

#app{display:flex;min-height:100vh;}

/* SIDEBAR */
.sidebar{
  width:230px;flex:0 0 230px;
  background:linear-gradient(180deg,#0d1526,#0a0f1c);
  border-right:1px solid var(--border-soft);
  padding:20px 14px;
  position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:18px;
}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;}
.brand-mark{
  width:34px;height:34px;border-radius:8px;flex:0 0 34px;
  background:conic-gradient(from 220deg, var(--red), var(--orange), var(--amber), var(--green), var(--blue), var(--red));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--disp);font-weight:700;font-size:13px;color:#0a0f1c;
  box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 6px 18px -6px rgba(76,141,255,.5);
}
.brand-mark span{background:#0a0f1c;color:#fff;width:100%;height:100%;border-radius:7px;display:flex;align-items:center;justify-content:center;margin:1.5px;font-size:12px;}
.brand-text{line-height:1.15;}
.brand-text .t1{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:.2px;}
.brand-text .t2{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;}
.sidebar-search-wrap{position:relative;margin:2px 6px 0}.sidebar-search{display:flex;align-items:center;gap:8px;padding:10px 11px;background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:10px;transition:.15s}.sidebar-search:focus-within{border-color:var(--blue);background:rgba(76,141,255,.055);box-shadow:0 0 0 3px rgba(76,141,255,.13)}.sidebar-search svg{width:15px;height:15px;flex:0 0 15px;color:var(--muted)}.sidebar-search input{min-width:0;width:100%;background:transparent;border:0;outline:0;color:var(--text);font:500 12px var(--body)}.sidebar-search input::placeholder{color:var(--muted-2)}.sidebar-search-clear{display:none;width:20px;height:20px;flex:0 0 20px;align-items:center;justify-content:center;padding:0;border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer}.sidebar-search-clear:hover{background:var(--panel);color:var(--text)}.sidebar-search-clear svg{width:12px;height:12px}.sidebar-search-results{display:none;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:80;max-height:330px;overflow:auto;padding:6px;background:rgba(13,21,38,.98);border:1px solid var(--border);border-radius:11px;box-shadow:0 18px 45px rgba(0,0,0,.45);backdrop-filter:blur(16px)}.sidebar-search-results.open{display:block}.sidebar-result-group{padding:7px 8px 4px;color:var(--muted-2);font-size:9.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase}.sidebar-result{width:100%;display:flex;align-items:flex-start;gap:9px;padding:9px 8px;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;text-align:left}.sidebar-result:hover,.sidebar-result.active{background:rgba(76,141,255,.1)}.sidebar-result-icon{width:24px;height:24px;flex:0 0 24px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--panel);color:#9fc0ff}.sidebar-result-icon svg{width:13px;height:13px}.sidebar-result-copy{min-width:0}.sidebar-result-title{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-result-meta{display:block;margin-top:2px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sidebar-search-empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}


.nav{display:flex;flex-direction:column;gap:2px;margin-top:4px;}
.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--muted-2);padding:12px 10px 6px;}
.nav-btn{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;
  color:var(--muted);background:transparent;border:1px solid transparent;
  cursor:pointer;font-size:13px;font-weight:500;text-align:left;width:100%;
  transition:background .12s, color .12s, border-color .12s;
  font-family:var(--body);
}
.nav-btn:hover{background:var(--panel);color:var(--text);}
.nav-btn.active{background:rgba(76,141,255,.1);color:#cfe0ff;border-color:rgba(76,141,255,.25);}
.nav-btn .ic{width:16px;height:16px;flex:0 0 16px;opacity:.9;}
/* Sidebar sizing and scrolling fixes */
.sidebar{overflow:hidden;min-height:0;}
.sidebar .brand,.sidebar-search-wrap,.sidebar-foot{flex:0 0 auto;}
.sidebar .nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:3px;scrollbar-width:thin;scrollbar-color:#233251 transparent;}
.nav-btn>svg{width:16px!important;height:16px!important;min-width:16px;max-width:16px;flex:0 0 16px;display:block;opacity:.9;}
.brand-mark{width:32px;height:32px;flex-basis:32px;}
.sidebar-foot{padding-bottom:max(10px,env(safe-area-inset-bottom));}
@media (max-height:720px){
  .sidebar{padding-top:14px;padding-bottom:12px;gap:10px;}
  .nav-label{padding-top:8px;}
  .nav-btn{padding-top:8px;padding-bottom:8px;}
  .sidebar-foot .hint{display:none;}
}

.nav-btn .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted-2);}
.nav-btn.active .count{color:#9fc0ff;}

.sidebar-foot{margin-top:auto;padding:10px 8px;border-top:1px solid var(--border-soft);}
.sync-pill{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(57,191,138,.15);flex:0 0 7px;}
.dot.sync{animation:pulse 1.1s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* MAIN */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:16px 26px;border-bottom:1px solid var(--border-soft);
  position:sticky;top:0;background:rgba(10,15,28,.85);backdrop-filter:blur(10px);z-index:20;
}
.topbar h1{font-family:var(--disp);font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;}
.topbar .sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px;}
.mobile-nav-toggle{display:none;width:38px;height:38px;align-items:center;justify-content:center;flex:0 0 38px;padding:0;}
.mobile-section-nav{display:none;}
.search{
  display:flex;align-items:center;gap:8px;background:var(--panel-2);
  border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:210px;
}
.search input{background:transparent;border:none;outline:none;color:var(--text);font-size:12.5px;width:100%;font-family:var(--body);}
.search svg{opacity:.5;flex:0 0 14px;}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:8px 13px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:12.5px;font-weight:600;
  cursor:pointer;font-family:var(--body);white-space:nowrap;
  transition:transform .08s, border-color .12s, background .12s;
}
.btn:hover{border-color:#33456b;background:#16223a;}
.btn:active{transform:translateY(1px);}
.btn.primary{background:linear-gradient(180deg,#5b96ff,#4c8dff);border-color:#4c8dff;color:#06122b;}
.btn.primary:hover{background:linear-gradient(180deg,#699dff,#5b96ff);}
.btn.danger{background:transparent;border-color:#4a2430;color:#f0a3a3;}
.btn.danger:hover{background:rgba(225,75,75,.1);border-color:#7a3040;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn.ghost:hover{background:var(--panel);color:var(--text);}
.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:6px;}
.btn svg{width:14px;height:14px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
input[type=file]{display:none;}

.content{padding:22px 26px 60px;max-width:1400px;width:100%;margin:0 auto;}
.view{display:none;animation:fadein .25s ease;}
.view.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* CARDS / KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px;}
.kpi{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:15px 16px;position:relative;overflow:hidden;
}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:8px;}
.kpi .val{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1;}
.kpi .val small{font-size:12px;color:var(--muted);font-family:var(--body);font-weight:500;}
.kpi.accent-blue{border-top:2px solid var(--blue);}
.kpi.accent-amber{border-top:2px solid var(--amber);}
.kpi.accent-red{border-top:2px solid var(--red);}
.kpi.accent-green{border-top:2px solid var(--green);}
.kpi.accent-purple{border-top:2px solid #9b7bff;}

/* HERO / COMMAND CENTRE HEADER */
.cc-hero{
  background:linear-gradient(135deg, rgba(76,141,255,.10), rgba(76,141,255,0) 55%), var(--panel);
  border:1px solid var(--border);border-radius:14px;
  padding:22px 24px;margin-bottom:16px;
  display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
  position:relative;overflow:hidden;
}
.cc-hero::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle, rgba(76,141,255,.18), transparent 70%);pointer-events:none;}
.cc-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--blue);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
.cc-eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(76,141,255,.18);}
.cc-hero h2{font-family:var(--disp);font-size:24px;font-weight:700;margin:0 0 6px;letter-spacing:.2px;}
.cc-hero p{margin:0;color:var(--muted);font-size:12.5px;max-width:520px;line-height:1.5;}
.cc-hero-actions{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;}

/* STAT GRID (command-centre style) */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat-card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;
}
.stat-card .ic-wrap{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(76,141,255,.12);color:var(--blue);}
.stat-card .ic-wrap svg{width:16px;height:16px;}
.stat-card.st-amber .ic-wrap{background:rgba(232,169,59,.14);color:var(--amber);}
.stat-card.st-red .ic-wrap{background:rgba(225,75,75,.14);color:var(--red);}
.stat-card.st-purple .ic-wrap{background:rgba(155,123,255,.14);color:#9b7bff;}
.stat-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted-2);font-weight:700;}
.stat-card .val{font-family:var(--disp);font-size:28px;font-weight:700;line-height:1;}
.stat-card .foot{font-size:11px;color:var(--muted);}
.stat-card .foot b{color:var(--text);font-weight:600;}

/* PERSONNEL MIX */
.mix-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;margin-bottom:8px;}
.mix-row .k{color:var(--muted);}
.mix-row .v{font-family:var(--mono);font-weight:700;}
.mix-track{height:10px;border-radius:6px;overflow:hidden;display:flex;background:var(--panel-2);border:1px solid var(--border-soft);margin-bottom:14px;}
.mix-track .seg{height:100%;}
.mix-legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:2px;}
.mix-legend .li{display:flex;align-items:center;gap:6px;}
.mix-legend .sw{width:9px;height:9px;border-radius:3px;}
.mix-total{display:flex;align-items:baseline;gap:8px;margin-bottom:14px;}
.mix-total .n{font-family:var(--disp);font-size:30px;font-weight:700;}
.mix-total .u{font-size:10px;color:var(--muted-2);letter-spacing:1px;text-transform:uppercase;}

/* ACTIVITY FEED */
.feed-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.feed-row:last-child{border-bottom:none;}
.feed-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:5px;flex:0 0 7px;}
.feed-dot.hi{background:var(--red);}
.feed-body{flex:1;min-width:0;}
.feed-body .n{font-weight:600;font-size:12.5px;}
.feed-body .d{color:var(--muted);font-size:11px;margin-top:1px;}
.feed-pts{font-family:var(--mono);font-weight:700;font-size:12.5px;color:var(--red);flex:0 0 auto;}

@media (max-width:1100px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }

.alert-banner{
  display:flex;align-items:flex-start;gap:12px;
  background:linear-gradient(90deg, rgba(232,169,59,.12), rgba(232,169,59,.03));
  border:1px solid rgba(232,169,59,.35);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:18px;
}
.alert-banner.ok{background:linear-gradient(90deg, rgba(57,191,138,.1), rgba(57,191,138,.02));border-color:rgba(57,191,138,.3);}
.alert-banner svg{flex:0 0 18px;margin-top:1px;color:var(--amber);}
.alert-banner.ok svg{color:var(--green);}
.alert-banner .t{font-size:12.5px;line-height:1.5;color:#e7d9bb;}
.alert-banner.ok .t{color:#c9ecdd;}
.alert-banner b{font-family:var(--disp);}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-bottom:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.panel h3{font-family:var(--disp);font-size:13.5px;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;font-weight:600;letter-spacing:.2px;}
.panel h3 .tag{font-size:10px;font-family:var(--mono);color:var(--muted-2);font-weight:400;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:12px;}
.bar-row .l{width:64px;flex:0 0 64px;color:var(--muted);font-family:var(--mono);font-size:11.5px;}
.bar-row .track{flex:1;height:16px;background:var(--panel-2);border-radius:5px;overflow:hidden;border:1px solid var(--border-soft);}
.bar-row .fill{height:100%;border-radius:5px 0 0 5px;transition:width .4s ease;}
.bar-row .n{width:26px;flex:0 0 26px;text-align:right;font-family:var(--mono);font-weight:600;}

.sev-major{background:linear-gradient(90deg,#e14b4b,#c73434);}
.sev-minor{background:linear-gradient(90deg,#e8763b,#d9611f);}
.sev-low{background:linear-gradient(90deg,#e8a93b,#c98a1e);}
.sev-ok{background:linear-gradient(90deg,#39bf8a,#22a56f);}
.sev-info{background:linear-gradient(90deg,#4c8dff,#2f6fe0);}

/* TABLE */
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border-soft);flex-wrap:wrap;}
.table-toolbar .spacer{flex:1;}
.chip-select{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font-size:12px;font-family:var(--body);outline:none;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
thead th{
  text-align:left;padding:10px 12px;color:var(--muted);font-weight:600;
  text-transform:uppercase;font-size:10px;letter-spacing:.7px;
  border-bottom:1px solid var(--border);background:var(--panel-2);
  position:sticky;top:57px;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle;}
tbody tr:hover{background:rgba(76,141,255,.045);}
tbody tr:last-child td{border-bottom:none;}
.mono{font-family:var(--mono);}
.name-cell .n{font-weight:600;}
.name-cell .d{color:var(--muted);font-size:11px;margin-top:1px;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;
  font-size:10.5px;font-weight:600;letter-spacing:.2px;border:1px solid transparent;
}
.badge.major{background:rgba(225,75,75,.13);color:#ff9a9a;border-color:rgba(225,75,75,.3);}
.badge.minor{background:rgba(232,118,59,.13);color:#ffb888;border-color:rgba(232,118,59,.3);}
.badge.low{background:rgba(232,169,59,.13);color:#ffd48f;border-color:rgba(232,169,59,.3);}
.badge.ok{background:rgba(57,191,138,.12);color:#7fe0bc;border-color:rgba(57,191,138,.3);}
.badge.inactive{background:rgba(139,154,179,.12);color:var(--muted);border-color:rgba(139,154,179,.25);}
.pts{font-family:var(--mono);font-weight:700;font-size:13px;}
.active-cases-table tbody tr{height:52px;}
.active-cases-table .name-cell .n{font-family:var(--body);font-size:13px;font-weight:700;line-height:18px;letter-spacing:0;}
.active-cases-table .name-cell .d{font-family:var(--mono);font-size:11px;font-weight:400;line-height:15px;letter-spacing:0;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.iconbtn{
  width:27px;height:27px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:7px;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);
  cursor:pointer;transition:.12s;
}
.iconbtn:hover{color:var(--text);border-color:#33456b;background:#16223a;}
.iconbtn.del:hover{color:#ff9a9a;border-color:#7a3040;background:rgba(225,75,75,.08);}
.iconbtn svg{width:13px;height:13px;}
.empty-state{padding:50px 20px;text-align:center;color:var(--muted);}
.empty-state svg{opacity:.35;margin-bottom:10px;}
.pager{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--border-soft);font-size:11.5px;color:var(--muted);}
.pager .spacer{flex:1;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(5,8,16,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.overlay.open{display:flex;}
.modal{
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  width:100%;max-width:480px;max-height:85vh;overflow:auto;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.6);
}
.modal.wide{max-width:600px;}
.modal-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--border-soft);}
.modal-head h3{font-family:var(--disp);font-size:15px;margin:0;font-weight:700;}
.modal-head .btn{margin-left:auto;}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:13px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--border-soft);}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.field input, .field select, .field textarea{
  background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
  padding:9px 10px;color:var(--text);font-size:13px;font-family:var(--body);outline:none;
  transition:border-color .12s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:11px;color:var(--muted-2);}
.of-log{display:flex;flex-direction:column;gap:6px;max-height:150px;overflow:auto;}
.of-log .row{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border-soft);padding:7px 9px;border-radius:7px;font-size:11.5px;}
.of-log .row .p{margin-left:auto;font-family:var(--mono);font-weight:700;color:var(--red);}

/* TOAST */
#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:#132038;border:1px solid var(--border);border-left:3px solid var(--green);
  padding:11px 15px;border-radius:9px;font-size:12.5px;min-width:240px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5);
  animation:slidein .25s ease;
}
.toast.err{border-left-color:var(--red);}
@keyframes slidein{from{transform:translateX(30px);opacity:0;}to{transform:none;opacity:1;}}
.toast .tt{font-weight:700;margin-bottom:2px;font-family:var(--disp);}
.toast .ts{color:var(--muted);}
.feedback-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.feedback-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:15px 16px;}
.feedback-card.pending{border-top:2px solid var(--amber);}.feedback-card.reviewed{border-top:2px solid var(--blue);}.feedback-card.appeal-accepted{border-top:2px solid var(--green);}.feedback-card.rejected{border-top:2px solid var(--red);}
.feedback-card .count{font:700 25px var(--disp);margin:5px 0;}.feedback-card .label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;}
.feedback-list{display:flex;flex-direction:column;gap:10px;}.feedback-item{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;padding:12px 14px;}
.feedback-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}.feedback-head .when{margin-left:auto;color:var(--muted-2);font-size:10.5px;}
.feedback-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;font-size:12.5px;}.feedback-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}
.feedback-form textarea{min-height:120px;resize:vertical;}.role-card{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;}
@media (max-width:760px){.feedback-grid{grid-template-columns:1fr;}}

.import-drop{
  border:1.5px dashed var(--border);border-radius:12px;padding:26px;text-align:center;
  color:var(--muted);cursor:pointer;transition:.15s;
}
.import-drop:hover{border-color:var(--blue);background:rgba(76,141,255,.04);}
.import-drop svg{margin-bottom:8px;opacity:.7;}
.import-drop b{color:var(--text);}

.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:2px;}
.legend .li{display:flex;align-items:center;gap:5px;}
.legend .sw{width:9px;height:9px;border-radius:3px;}

/* PROJECT SUMMARY */
.summary-hero{align-items:center;padding:26px 28px;}
.summary-hero p{max-width:740px;font-size:13px;line-height:1.65;}
.summary-status{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid rgba(57,191,138,.3);border-radius:999px;background:rgba(57,191,138,.08);color:#9be5c8;font:600 11.5px var(--body);white-space:nowrap;}
.summary-status .dot{box-shadow:0 0 0 3px rgba(57,191,138,.13);}
.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px;}
.summary-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
.summary-card .ic-wrap{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(76,141,255,.12);color:var(--blue);margin-bottom:13px;}
.summary-card .ic-wrap svg{width:17px;height:17px;}
.summary-card h3{margin:0 0 7px;font:600 14px var(--disp);}
.summary-card p{margin:0;color:var(--muted);font-size:12px;line-height:1.65;}
.summary-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px;counter-reset:summary-step;}
.summary-step{position:relative;min-height:118px;padding:16px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:9px;counter-increment:summary-step;}
.summary-step::before{content:counter(summary-step,decimal-leading-zero);display:block;margin-bottom:12px;color:var(--blue);font:600 11px var(--mono);letter-spacing:.8px;}
.summary-step b{display:block;margin-bottom:5px;font:600 12.5px var(--disp);}
.summary-step span{color:var(--muted);font-size:11.5px;line-height:1.55;}
.summary-note{display:flex;align-items:flex-start;gap:12px;padding:15px 16px;background:linear-gradient(90deg,rgba(76,141,255,.11),rgba(76,141,255,.025));border:1px solid rgba(76,141,255,.28);border-radius:var(--radius);}
.summary-note>svg{width:18px;height:18px;flex:0 0 18px;color:#9fc0ff;margin-top:1px;}
.summary-note b{display:block;margin-bottom:4px;font:600 12.5px var(--disp);}
.summary-note p{margin:0;color:var(--muted);font-size:11.8px;line-height:1.6;}

@media (max-width:1100px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .summary-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .summary-flow{grid-template-columns:repeat(2,minmax(0,1fr));}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:50;transition:.2s;}
  .sidebar.open{transform:none;}
  .mobile-nav-toggle{display:inline-flex;}
}
@media (max-width:720px){
  .topbar{padding:13px 14px;gap:9px;flex-wrap:wrap;}
  .topbar h1{font-size:16px;}
  .topbar .sub{max-width:205px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mobile-section-nav{display:flex;align-items:center;gap:9px;order:3;width:100%;padding:8px 10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;}
  .mobile-section-nav label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .mobile-section-nav select{min-width:0;flex:1;padding:8px 30px 8px 10px;background:var(--panel);border:1px solid var(--border);border-radius:7px;color:var(--text);font:600 13px var(--body);}
  .content{padding:17px 14px 45px;}
  .top-actions{order:4;width:100%;overflow-x:auto;padding-bottom:2px;}
  .top-actions .search{min-width:165px;}
  .kpi-grid,.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .field-row{grid-template-columns:1fr;}
  .cc-hero{padding:17px;}
  .summary-grid,.summary-flow{grid-template-columns:1fr;}
  .summary-status{white-space:normal;}
}

/* LOGIN SCREEN */
#login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg-grad);padding:20px;
}
.login-card{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;padding:30px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.login-card .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.login-card h2{margin:0 0 4px;font-family:var(--disp);font-size:20px;}
.login-card .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px;}
.login-card form{display:flex;flex-direction:column;gap:14px;}
.login-card .btn.primary{justify-content:center;padding:10px 13px;font-size:13px;margin-top:4px;}
.login-divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;color:var(--muted-2);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}

.login-visitor{width:100%;justify-content:center;padding:10px 13px;border-color:rgba(76,141,255,.32);}
.login-error{

.login-demo-hint{font-size:11px;color:var(--muted-2);margin-top:16px;text-align:center;}
.user-pill{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);padding:8px 10px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;}
.user-pill .avatar{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#5b96ff,#4c8dff);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#06122b;flex:0 0 22px;}
.readonly-banner{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:16px;border:1px solid rgba(76,141,255,.28);border-radius:10px;background:rgba(76,141,255,.08);color:#cfe0ff;font-size:12px;}
.readonly-banner>svg{width:16px;height:16px;flex:0 0 16px;}
.readonly-banner .btn{margin-left:auto;}
.backup-banner{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;
  background:rgba(232,169,59,.1);border:1px solid #4a3a1f;color:#e8c98b;font-size:12.5px;margin-bottom:14px;
}
.backup-banner svg{width:16px;height:16px;flex:0 0 16px;}
.of-meta{font-size:10.5px;color:var(--muted-2);}
.incident-person-card{display:none;padding:13px;border:1px solid var(--border-soft);border-radius:10px;background:var(--panel-2);}
.incident-person-card.show{display:block;}
.incident-person-card .field input[readonly]{color:var(--text);background:rgba(255,255,255,.025);cursor:default;}
.incident-projection{display:none;padding:11px 12px;border:1px solid rgba(76,141,255,.25);border-radius:9px;background:rgba(76,141,255,.08);font-size:12px;line-height:1.6;color:var(--muted);}

.offence-picker-controls{display:grid;grid-template-columns:minmax(0,1fr) 145px;gap:8px;margin-bottom:8px;}
.offence-picker-search{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:0 10px;}
.offence-picker-search:focus-within{border-color:var(--blue);}
.offence-picker-search svg{width:14px;height:14px;flex:0 0 14px;color:var(--muted);}
.offence-picker-search input{width:100%;min-width:0;padding:9px 0;border:0;background:transparent;color:var(--text);font:13px var(--body);outline:none;}

  .readonly-banner{align-items:flex-start;flex-wrap:wrap;}
  .readonly-banner .btn{width:100%;margin-left:0;justify-content:center;}
}

/* ============ SHARED ONLINE STORAGE ============ */

let saveTimer = null;
let saveInFlight = false;
let remoteRefreshTimer = null;
let latestRemoteUpdate = null;
let currentRevision = 0;
let saveConflict = false;
function queueSave(key){
  if(!requireAdminAccess()) return;
  if(saveConflict){ toast('Refresh required', 'Shared records changed elsewhere. Refresh before making more changes.', true); return; }
  clearTimeout(saveTimer);
  markSyncing(true);
  saveTimer = setTimeout(()=>{ saveTimer = null; persist(key); }, 260);
}

async function persist(key){
  if(!isAdministrator()) return false;
  if(!Number.isSafeInteger(currentRevision) || currentRevision < 1){
    toast('Save unavailable', 'The current record revision is missing. Refresh and try again.', true);
    return false;
  }
  saveInFlight = true;
  try{
    const map = { offences: state.offences, staffs: state.staffs, workers: state.workers, sdp: state.sdp, wdp: state.wdp };
    state.meta.lastUpdated = new Date().toISOString();
    const payload = key && map[key] !== undefined
      ? { [key]: map[key], meta: state.meta }
      : { ...map, meta: state.meta };
    const response = await fetch('/api/state', {
      method: 'PUT',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: payload, revision: currentRevision }),
    });
    const result = await response.json();
    if(response.status===401 || response.status===403){
      state.currentUser = null;
      renderLogin('Your administrator session expired. Please sign in again.');
      return false;
    }
    if(response.status===409){
      saveConflict = true;
      if(remoteRefreshTimer){ clearInterval(remoteRefreshTimer); remoteRefreshTimer = null; }
      toast('Save conflict', result.error || 'Records changed elsewhere. Refresh and reapply this change.', true);
      return false;
    }
    if(!response.ok) throw new Error(result.error || 'Unable to save shared records');
    currentRevision = result.revision;
    latestRemoteUpdate = result.lastUpdated;
    state.meta.lastUpdated = result.lastUpdated;
    return true;
  }catch(e){
    console.error('Storage save failed', e);
    toast('Save failed', e.message, true);
    return false;
  }finally{
    saveInFlight = false;
    markSyncing(false);
  }
}

async function refreshFeedback(render){
  if(!state.currentUser) return false;
  try{
    const response = await fetch('/api/feedback', { credentials:'same-origin', cache:'no-store' });
    if(response.status===401){ state.currentUser=null; renderLogin('Your session expired. Please sign in again.'); return false; }
    const result = await response.json();
    if(!response.ok) throw new Error(result.error || 'Unable to load feedback');
    state.feedback = Array.isArray(result.items) ? result.items : [];
    state.feedbackSummary = result.summary || { pending:0, reviewed:0, appealAccepted:0, rejected:0 };
    if(render && document.getElementById('nav-count-feedback')){
      updateFeedbackCount();
      if(state.tab==='feedback') renderFeedback();
      if(state.tab==='dashboard') renderDashboard();
    }
    return true;
  }catch(error){
    console.warn('Unable to refresh feedback', error);
    if(render) toast('Feedback refresh failed', error.message || 'Please try again.', true);
    return false;
  }
}

async function refreshSharedState(manual, quiet=false){
  if(saveConflict && !manual) return;
  if(!state.currentUser || saveTimer || saveInFlight || document.hidden) return;
  const overlay = document.getElementById('overlay');
  if(overlay && overlay.classList.contains('open')) return;

  try{
    const since = currentRevision ? '?revision='+encodeURIComponent(currentRevision) : '';
    const response = await fetch('/api/state'+since, { credentials:'same-origin', cache:'no-store' });
    if(response.status === 401){ state.currentUser = null; renderLogin('Your session expired. Please sign in again.'); return; }
    const remote = await response.json();
    if(!response.ok) throw new Error(remote.error || 'Unable to refresh shared records');
    if(isAdministrator() && remote.access!=='admin'){
      state.currentUser = null;
      renderLogin('Your administrator session expired. Please sign in again.');
      return;
    }
    if(remote.unchanged){ if(manual) toast('Dashboard refreshed', 'Shared records are up to date.'); return; }

    const latest = remote.state || {};
    for(const key of ['offences','staffs','workers','sdp','wdp']){
      if(Array.isArray(latest[key])) state[key] = latest[key];
    }
    if(latest.meta && typeof latest.meta === 'object') state.meta = latest.meta;
    currentRevision = remote.revision || currentRevision;
    latestRemoteUpdate = remote.lastUpdated || latestRemoteUpdate;
    saveConflict = false;
    startLiveUpdates();
    renderAll();
    if(!quiet) toast(manual ? 'Dashboard refreshed' : 'Records updated', manual ? 'Latest shared records loaded.' : 'Changes from another authorized device are now visible.');
  }catch(error){
    console.warn('Unable to refresh shared records', error);
    if(manual) toast('Refresh failed', error.message || 'Please try again.', true);
  }
}

function startLiveUpdates(){
  if(remoteRefreshTimer) clearInterval(remoteRefreshTimer);
  remoteRefreshTimer = setInterval(()=>{ refreshSharedState(false); refreshFeedback(false); }, 12000);
}

async function boot(){
  let remote;
  try{
    const response = await fetch('/api/state', { credentials: 'same-origin', cache: 'no-store' });
    remote = await response.json();
    if(!response.ok) throw new Error(remote.error || 'Unable to load shared records');
  }catch(error){
    renderLogin(error.message || 'Unable to connect to the shared records service.');
    return;
  }
  if(isAdministrator() && remote.access!=='admin'){
    state.currentUser = null;
    renderLogin('Your administrator session expired. Please sign in again.');
    return;
  }
  const { offences, staffs, workers, sdp, wdp, meta } = remote.state || {};
  latestRemoteUpdate = remote.lastUpdated || null;
  currentRevision = remote.revision || 0;
  const bundledVersion = SEED.seedVersion || null;
  const savedVersion = meta && meta.seedVersion;
  const ruleLibraryStale = !!bundledVersion && !!savedVersion && savedVersion !== bundledVersion;

  state.offences = offences || SEED.offences;
  state.staffs = staffs || [];
  state.workers = workers || [];
  state.sdp = sdp || SEED.sdp;
  state.wdp = wdp || SEED.wdp;
  state.meta = meta || { lastUpdated: null, lastImport: 'Seeded from OE-SEC9-DMS-01_-_Demerit_System.xlsx', lastExport: null };
  if(state.meta.lastExport === undefined) state.meta.lastExport = null;
  if(!state.meta.seedVersion) state.meta.seedVersion = bundledVersion;
  state.staffs.forEach(p=>normalizePersonRecord(p, 'staff'));
  state.workers.forEach(p=>normalizePersonRecord(p, 'worker'));
  if(isAdministrator() && (!offences || !staffs || !workers || !sdp || !wdp)){
    await persist();
  }
  await refreshFeedback(false);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  renderShell();
  renderAll();
  startLiveUpdates();
  if(ruleLibraryStale && isAdministrator()){
    toast('Policy update available', 'Existing customized rules were preserved. Import or review the new policy explicitly before replacing them.');
  }
}

/* ============ SERVER-AUTHENTICATED ACCOUNTS ============ */

function currentUser(){ return state.currentUser; }
function currentRole(){ return String(currentUser()?.role||'').trim().toLowerCase(); }
function isSuperAdmin(){ return currentRole()==='super_admin'; }
function isStandardUser(){ return currentRole()==='standard_user'; }
function isAdministrator(){ return currentRole()==='super_admin' || currentRole()==='admin'; }
function canManageAccounts(){ return isSuperAdmin() || currentRole()==='admin'; }
function roleLabel(){ return isSuperAdmin()?'Super Admin':currentRole()==='admin'?'Admin':isStandardUser()?'Standard User':'Authorized User'; }
function requireAdminAccess(){
  if(isAdministrator()) return true;
  toast('Admin access required', 'Standard Users have read-only access to personnel records.', true);
  return false;
}

async function logout(){
  if(remoteRefreshTimer){ clearInterval(remoteRefreshTimer); remoteRefreshTimer = null; }
  if(currentUser()?.source==='workspace'){
    location.href='/signout-with-chatgpt?return_to=%2F';
    return;
  }
  try{ await fetch('/api/auth', { method:'DELETE', credentials:'same-origin' }); }
  catch(error){ console.warn('Unable to close the current session', error); }
  state.currentUser = null;
  location.reload();
}

    state.currentUser = result.user;

  }
}

/* ---------- helpers ---------- */
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,8).toUpperCase(); }
function clamp(n,a,b){ return Math.max(a, Math.min(b, n)); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const d = new Date(iso); return d.toLocaleString(undefined,{month:'short',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function todayISODate(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function daysSinceBackup(){
  if(!state.meta.lastExport) return Infinity;
  return (Date.now() - new Date(state.meta.lastExport).getTime()) / 86400000;
}
function backupBannerHtml(){
  if(!isAdministrator()) return '';
  const days = daysSinceBackup();
  if(!isFinite(days)){
    return `<div class="backup-banner">${ICONS.alert}<div>No Excel backup is on record yet. Shared records are stored online, but an exported workbook is recommended for reporting and recovery.</div></div>`;
  }
  if(days >= 7){
    return `<div class="backup-banner">${ICONS.alert}<div>Last backup was ${Math.floor(days)} day${Math.floor(days)===1?'':'s'} ago. Consider exporting an updated workbook from <b>Import / Export</b>.</div></div>`;
  }
  return '';
}

function severityClass(sev){
  if(!sev) return 'ok';
  const s = sev.toLowerCase();
  if(s.includes('major')) return 'major';
  if(s.includes('minor')) return 'minor';
  if(s.includes('low')) return 'low';
  return 'ok';
}

function thresholdTable(group){ return group === 'staff' ? state.sdp : state.wdp; }

function tierFor(points, group){
  const table = thresholdTable(group);
  const sorted = [...table].sort((a,b)=> (b.min||0)-(a.min||0));
  for(const row of sorted){
    if(points >= (row.min||0) && points <= (row.max||999)) return row;
  }
  return null;
}

function activeBand(points){
  if(points>=70) return '70+';
  if(points>=61) return '61-69';
  if(points>=51) return '51-60';
  if(points>=41) return '41-50';
  if(points>=21) return '21-40';
  if(points>=15) return '15-20';
  return null;
}

function recalcAction(p, group){
  const tier = tierFor(p.demeritPoints, group);
  p.action = p.demeritPoints > 0 ? (tier ? tier.action : 'No Disciplinary Action') : 'No Disciplinary Action';
  p.totalPoints = clamp(100 - p.demeritPoints, 0, 100);
}

// Recomputes demeritPoints from active offence entries so the total always matches the record.
function recalcPointsFromLog(p, group){
  const total = (p.offenceLog||[]).reduce((s,o)=> s + (o.voided ? 0 : (o.points||0)), 0);
  p.demeritPoints = clamp(total, 0, 100);
  recalcAction(p, group);
}

function normalizePersonRecord(p, group){
  p.offenceLog = Array.isArray(p.offenceLog) ? p.offenceLog : [];
  p.offenceLog.forEach(o=>{
    if(!o.id) o.id = uid('INC');
    if(o.voided===undefined) o.voided = false;
  });
  const loggedPoints = clamp(p.offenceLog.reduce((sum,o)=>sum+(o.voided?0:(Number(o.points)||0)),0),0,100);
  const recordedPoints = clamp(Number(p.demeritPoints)||0,0,100);
  if(recordedPoints > loggedPoints){
    p.offenceLog.push({
      id:uid('INC'),
      label:'Imported baseline adjustment',
      points:recordedPoints-loggedPoints,
      by:'legacy import',
      voided:false,
    });
  }
  recalcPointsFromLog(p, group);
}

function allPeople(){
  return [
    ...state.staffs.map(p=>({...p, group:'staff'})),
    ...state.workers.map(p=>({...p, group:'worker'})),
  ];
}

function findPerson(id){
  let p = state.staffs.find(x=>x.id===id);
  if(p) return {p, group:'staff', arr: state.staffs};
  p = state.workers.find(x=>x.id===id);
  if(p) return {p, group:'worker', arr: state.workers};
  return null;
}

function setupSidebarSearch(){
  const input=document.getElementById('sidebar-global-search'), results=document.getElementById('sidebar-search-results'), clear=document.getElementById('sidebar-search-clear'), wrap=document.getElementById('sidebar-search-wrap');
  if(!input||!results||!clear||!wrap)return;
  let matches=[],activeIndex=-1;
  const close=()=>{results.classList.remove('open');activeIndex=-1};
  const render=()=>{
    const q=input.value.toLowerCase().trim(); clear.style.display=q?'inline-flex':'none';
    if(!q){results.innerHTML='';close();return}
    const staff=state.staffs.filter(p=>[p.employeeId,p.name,p.agent,p.division,p.designation].join(' ').toLowerCase().includes(q)).slice(0,5).map(p=>({type:'staff',id:p.id,title:p.name,meta:[p.employeeId,p.designation,p.division].filter(Boolean).join(' · ')}));
    const workers=state.workers.filter(p=>[p.employeeId,p.name,p.agent,p.division,p.designation,p.passportNo].join(' ').toLowerCase().includes(q)).slice(0,5).map(p=>({type:'worker',id:p.id,title:p.name,meta:[p.employeeId,p.designation,p.agent].filter(Boolean).join(' · ')}));
    const offences=state.offences.filter(o=>[o.id,o.offence,o.severity,o.reason].join(' ').toLowerCase().includes(q)).slice(0,5).map(o=>({type:'offence',id:o.id,title:o.offence,meta:o.severity+' · '+o.points+' points'}));
    matches=[...staff,...workers,...offences];activeIndex=-1;
    if(!matches.length){results.innerHTML='<div class="sidebar-search-empty">No staff, worker, or offence matches found.</div>';results.classList.add('open');return}
    const groups=[['staff','Staff',ICONS.staff],['worker','Workers',ICONS.worker],['offence','Offence rules',ICONS.rules]];
    results.innerHTML=groups.map(([type,label,icon])=>{const items=matches.filter(m=>m.type===type);if(!items.length)return '';return `<div class="sidebar-result-group">${label}</div>`+items.map(item=>{const i=matches.indexOf(item);return `<button class="sidebar-result" type="button" role="option" data-result-index="${i}"><span class="sidebar-result-icon">${icon}</span><span class="sidebar-result-copy"><span class="sidebar-result-title">${esc(item.title)}</span><span class="sidebar-result-meta">${esc(item.meta)}</span></span></button>`}).join('')}).join('');results.classList.add('open');
  };
  const open=item=>{if(!item)return;input.value='';clear.style.display='none';close();if(item.type==='staff'){switchTab('staffs');setTimeout(()=>openPersonModal(item.id,'staff'),30)}else if(item.type==='worker'){switchTab('workers');setTimeout(()=>openPersonModal(item.id,'worker'),30)}else{switchTab('offences');setTimeout(()=>openRuleModal(item.id),30)}};
  input.addEventListener('input',render);input.addEventListener('focus',()=>{if(input.value.trim())render()});clear.addEventListener('click',()=>{input.value='';render();input.focus()});
  results.addEventListener('click',e=>{const b=e.target.closest('[data-result-index]');if(b)open(matches[+b.dataset.resultIndex])});
  input.addEventListener('keydown',e=>{const bs=[...results.querySelectorAll('.sidebar-result')];if(e.key==='ArrowDown'&&bs.length){e.preventDefault();activeIndex=(activeIndex+1)%bs.length}else if(e.key==='ArrowUp'&&bs.length){e.preventDefault();activeIndex=(activeIndex-1+bs.length)%bs.length}else if(e.key==='Enter'&&activeIndex>=0){e.preventDefault();open(matches[+bs[activeIndex].dataset.resultIndex]);return}else if(e.key==='Escape'){close();return}else return;bs.forEach((b,i)=>b.classList.toggle('active',i===activeIndex));bs[activeIndex].scrollIntoView({block:'nearest'})});
  document.addEventListener('click',e=>{if(!wrap.contains(e.target))close()});
}

    <div class="panel"><h3>Completed comments and appeals <span class="tag">${resolved.length} displayed</span></h3><div class="feedback-list">${resolved.length?resolved.map(item=>feedbackItemHtml(item,false)).join(''):'<div class="empty-state">No comments or appeals have been completed yet.</div>'}</div></div>`;

  const submitButton = document.getElementById('btn-submit-feedback');
  if(submitButton) submitButton.addEventListener('click', async ()=>{
    const type = document.getElementById('feedback-type').value;
    const body = document.getElementById('feedback-body').value.trim();
    if(body.length<5){ toast('More detail required', 'Feedback must contain at least 5 characters.', true); return; }
    submitButton.disabled=true;
    try{
      const response = await fetch('/api/feedback',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,body})});
      const result = await response.json();
      if(!response.ok) throw new Error(result.error || 'Unable to submit feedback');
      toast('Feedback submitted', 'Status: pending Admin review.');
      await refreshFeedback(true);
    }catch(error){ toast('Submission failed', error.message, true); submitButton.disabled=false; }
  });
  el.querySelectorAll('[data-moderate-id]').forEach(button=>button.addEventListener('click', async ()=>{
    const status=button.dataset.moderateStatus;
    if(!confirm(moderationPrompt(status))) return;
    button.disabled=true;
    try{
      const response=await fetch('/api/feedback',{method:'PATCH',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:button.dataset.moderateId,status})});
      const result=await response.json();
      if(!response.ok) throw new Error(result.error || 'Unable to moderate feedback');
      toast(moderationResultLabel(status), 'The updated status is now displayed on the Dashboard.');
      await refreshFeedback(true);
    }catch(error){ toast('Moderation failed', error.message, true); button.disabled=false; }
  }));
}

async function renderUsers(){
  const el=document.getElementById('view-users');
  if(!el || !canManageAccounts()) return;
  el.innerHTML='<div class="panel"><div class="hint">Loading managed accounts…</div></div>';
  try{
    const response=await fetch('/api/users',{credentials:'same-origin',cache:'no-store'});
    const result=await response.json();
    if(!response.ok) throw new Error(result.error || 'Unable to load accounts');
    state.users=Array.isArray(result.accounts)?result.accounts:[];
    state.canCreateRole=result.canCreateRole;
    const targetLabel=state.canCreateRole==='admin'?'Admin':'Standard User';
    el.innerHTML=`<div class="grid-2">
      <div class="panel"><h3>Create ${targetLabel} account <span class="tag">${roleLabel()} permission</span></h3>
        <form id="create-user-form">
          <div class="field"><label>Display name</label><input id="new-user-name" maxlength="120" required></div>
          <div class="field"><label>Username</label><input id="new-user-username" maxlength="64" autocomplete="off" required placeholder="letters, numbers, dots, underscores or hyphens"></div>
          <div class="field"><label>Temporary password</label><input id="new-user-password" type="password" minlength="8" maxlength="1024" autocomplete="new-password" required></div>
          <div style="display:flex;justify-content:flex-end;margin-top:12px;"><button class="btn primary" type="submit">${ICONS.plus}<span>Create ${targetLabel}</span></button></div>
        </form>
      </div>
      <div class="panel"><h3>Role permission <span class="tag">enforced by server</span></h3><div class="role-card">${ICONS.shield}<div><b>${roleLabel()}</b><div class="hint">${isSuperAdmin()?'Can create Admin accounts; delete Admin or Standard User accounts; and review comments or appeals.':'Can create or delete Standard User accounts and review comments or appeals.'}</div></div></div></div>
    </div>
    <div class="panel"><h3>Managed accounts <span class="tag">${state.users.length} managed</span></h3><div class="feedback-list">${state.users.length?state.users.map(account=>{const accountRole=account.role==='admin'?'Admin':'Standard User';return `<div class="role-card"><div class="avatar">${esc((account.name||'?').slice(0,1).toUpperCase())}</div><div style="flex:1;"><b>${esc(account.name)}</b><div class="hint">${esc(account.username)} · created ${fmtDate(account.createdAt)}${account.createdBy?` by ${esc(account.createdBy)}`:''}</div></div><span class="badge ${account.role==='admin'?'low':'ok'}">${accountRole}</span><button class="btn danger sm" data-delete-account="${esc(account.username)}" data-delete-role="${accountRole}">${ICONS.trash}<span>Delete</span></button></div>`;}).join(''):'<div class="empty-state">No managed accounts created yet.</div>'}</div></div>`;
    document.getElementById('create-user-form').addEventListener('submit', async event=>{
      event.preventDefault();
      const button=event.currentTarget.querySelector('button[type="submit"]'); button.disabled=true;
      const payload={name:document.getElementById('new-user-name').value.trim(),username:document.getElementById('new-user-username').value.trim(),password:document.getElementById('new-user-password').value};
      try{
        const createResponse=await fetch('/api/users',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        const created=await createResponse.json();
        if(!createResponse.ok) throw new Error(created.error || 'Unable to create account');
        toast(targetLabel+' account created', created.account.username);
        await renderUsers();
      }catch(error){ toast('Account creation failed', error.message, true); button.disabled=false; }
    });
    el.querySelectorAll('[data-delete-account]').forEach(button=>button.addEventListener('click', async ()=>{
      const username=button.dataset.deleteAccount;
      const accountRole=button.dataset.deleteRole;
      if(!confirm(`Delete ${accountRole} account "${username}"? This immediately signs out the account and cannot be undone.`)) return;
      button.disabled=true;
      try{
        const deleteResponse=await fetch('/api/users',{method:'DELETE',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username})});
        const deleted=await deleteResponse.json();
        if(!deleteResponse.ok) throw new Error(deleted.error || 'Unable to delete account');
        toast(accountRole+' account deleted', username+' can no longer sign in.');
        await renderUsers();
      }catch(error){ toast('Account deletion failed', error.message, true); button.disabled=false; }
    }));
  }catch(error){ el.innerHTML=`<div class="alert-banner">${ICONS.alert}<div class="t"><b>Unable to load accounts.</b> ${esc(error.message)}</div></div>`; }
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const people = allPeople();
  const totalPop = people.length;
  const active = people.filter(p=>p.demeritPoints>0);
  const activeCases = active.length;
  const totalDemerit = people.reduce((s,p)=>s+(p.demeritPoints||0),0);
  const highRisk = people.filter(p=>p.demeritPoints>=70).length;
  const caseRate = totalPop ? (activeCases/totalPop) : 0;

  const bands = ['15-20','21-40','41-50','51-60','61-69','70+'];
  const bandCounts = {}; bands.forEach(b=>bandCounts[b]=0);
  active.forEach(p=>{ const b = activeBand(p.demeritPoints); if(b) bandCounts[b]++; });
  const maxBand = Math.max(1, ...Object.values(bandCounts));

  const byAgent = {};
  people.forEach(p=>{ const a = p.agent || 'Unassigned'; byAgent[a]=(byAgent[a]||0)+1; });
  const agentEntries = Object.entries(byAgent).sort((a,b)=>b[1]-a[1]);
  const maxAgent = Math.max(1, ...agentEntries.map(e=>e[1]));

  const bySeverity = {};
  state.offences.forEach(o=>{ const s=o.severity||'Other'; bySeverity[s]=(bySeverity[s]||0)+1; });
  const sevEntries = Object.entries(bySeverity);
  const maxSev = Math.max(1, ...sevEntries.map(e=>e[1]));

  const dataIssues = [];
  const missingIds = people.filter(p=>!p.employeeId).length;
  if(missingIds) dataIssues.push([`Missing employee IDs`, missingIds]);
  const missingDivision = people.filter(p=>!p.division).length;
  if(missingDivision) dataIssues.push([`Missing division`, missingDivision]);
  const missingDesignation = people.filter(p=>!p.designation).length;

  const invalidTotals = people.filter(p=> (p.totalPoints + p.demeritPoints) !== 100 && p.demeritPoints<=100).length;

  const cases = active.slice().sort((a,b)=>b.demeritPoints-a.demeritPoints);
  const staffCount = state.staffs.length, workerCount = state.workers.length;
  const staffPct = totalPop ? Math.round(staffCount/totalPop*100) : 0;
  const workerPct = totalPop ? 100-staffPct : 0;
  const feed = cases.slice(0,6);
  const personnelFeedback = state.feedback

    .slice(0,8);

  el.querySelectorAll('[data-view-case]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const found = findPerson(b.dataset.viewCase);
      if(found){ switchTab(found.group==='staff'?'staffs':'workers'); setTimeout(()=>openPersonModal(found.p.id, found.group), 30); }
    });
  });
}

/* ============ PEOPLE TABLES ============ */
function renderPeopleTable(group){
  const isStaff = group==='staff';
  const key = isStaff ? 'staffs' : 'workers';
  const list = state[key];
  const q = (state.search[key]||'').toLowerCase().trim();
  const filterVal = state.filter[key];

  let rows = list.filter(p=>{
    if(q){
      const hay = [p.employeeId,p.name,p.agent,p.division,p.designation].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(filterVal==='active-cases') return p.demeritPoints>0;
    if(filterVal==='clean') return p.demeritPoints===0;
    return true;
  });
  rows = rows.slice().sort((a,b)=> b.demeritPoints - a.demeritPoints || a.name.localeCompare(b.name));

  const el = document.getElementById('view-'+key);
  el.innerHTML = `
    <div class="table-wrap">
      <div class="table-toolbar">
        <select class="chip-select" id="filter-select">
          <option value="all" ${filterVal==='all'?'selected':''}>All ${key}</option>
          <option value="active-cases" ${filterVal==='active-cases'?'selected':''}>With active demerit</option>
          <option value="clean" ${filterVal==='clean'?'selected':''}>Clean record</option>
        </select>
        <div class="hint">${rows.length} of ${list.length} shown</div>
        <div class="spacer"></div>
        <div class="hint">Sorted by demerit points, highest first</div>
      </div>
      ${rows.length===0 ? `<div class="empty-state">${ICONS.search}<div>No records match your search.</div></div>` : `
      <table>
        <thead><tr>
          <th>Employee ID</th><th>Name</th><th>${isStaff?'Designation':'Designation / Shift'}</th><th>${isStaff?'Division':'Agent'}</th>
          <th>Status</th><th>Points</th><th>Action Taken</th><th style="text-align:right;">${isAdministrator()?'Manage':'View'}</th>
        </tr></thead>
        <tbody>
          ${rows.map(p=>`
            <tr>
              <td class="mono">${esc(p.employeeId)||'<span class="badge low">missing</span>'}</td>
              <td class="name-cell"><div class="n">${esc(p.name)}</div>${!isStaff?`<div class="d">${esc(p.passportNo||'no passport on file')}</div>`:''}</td>
              <td>${esc(p.designation)}${!isStaff?` <span class="hint">· Shift ${esc(p.shift||'—')}</span>`:''}</td>
              <td>${esc(isStaff ? p.division : p.agent)}</td>
              <td><span class="badge ${p.status==='Active'?'ok':'inactive'}">${esc(p.status||'Active')}</span></td>
              <td class="pts" style="color:${p.demeritPoints>=70?'var(--red)':p.demeritPoints>=41?'var(--orange)':p.demeritPoints>0?'var(--amber)':'var(--green)'}">${p.demeritPoints}<span class="hint" style="font-family:var(--body);"> / 100</span></td>
              <td style="max-width:180px;">${esc(p.action)}</td>
              <td>
                <div class="row-actions">
                  ${isAdministrator()?`<button class="iconbtn" title="Edit record" aria-label="Edit ${esc(p.name)}" data-edit="${p.id}">${ICONS.edit}</button>
                  <button class="iconbtn del" title="Delete record" aria-label="Delete ${esc(p.name)}" data-del="${p.id}">${ICONS.trash}</button>`:`<button class="btn sm ghost" data-view-person="${p.id}">View</button>`}
                </div>
              </td>
            </tr>`).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  document.getElementById('filter-select').addEventListener('change', (e)=>{ state.filter[key]=e.target.value; renderPeopleTable(group); });
  el.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> openPersonModal(b.dataset.edit, group)));
  el.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=> confirmDeletePerson(b.dataset.del, group)));
  el.querySelectorAll('[data-view-person]').forEach(b=> b.addEventListener('click', ()=> openPersonModal(b.dataset.viewPerson, group)));
}

        <div class="offence-picker-search">${ICONS.search}<input id="${prefix}-search" type="search" autocomplete="off" placeholder="Name, description, ID or points…"/></div>
      </div>
      <div class="field">
        <label for="${prefix}-severity">Filter Severity</label>
        <select id="${prefix}-severity">
          <option value="all">All severities</option>
          <option value="Major Offence">Major</option>
          <option value="Minor Offence">Minor</option>
          <option value="Low Offence">Low</option>
        </select>
      </div>
    </div>`;

function setupOffencePicker(prefix, selectId, onSelectionChange){
  const searchInput = document.getElementById(prefix+'-search');
  const severitySelect = document.getElementById(prefix+'-severity');
  const ruleSelect = document.getElementById(selectId);
  const count = document.getElementById(prefix+'-count');
  if(!searchInput || !severitySelect || !ruleSelect || !count) return null;

  const renderOptions = ()=>{
    const query = searchInput.value.toLowerCase().trim();
    const severity = severitySelect.value;
    const previous = ruleSelect.value;
    const matches = state.offences
      .filter(rule=> severity==='all' || rule.severity===severity)
      .filter(rule=> !query || [rule.id,rule.offence,rule.reason,rule.severity,rule.points].join(' ').toLowerCase().includes(query))
      .sort((a,b)=> b.points-a.points || a.offence.localeCompare(b.offence));

    ruleSelect.innerHTML = `<option value="">${matches.length?'Select an offence rule…':'No offence rules match'}</option>`+
      matches.map(rule=>`<option value="${esc(rule.id)}">[${esc(rule.severity.replace(' Offence',''))}] ${esc(rule.offence)} — ${rule.points} pts</option>`).join('');
    ruleSelect.disabled = matches.length===0;
    if(matches.some(rule=>rule.id===previous)) ruleSelect.value = previous;
    count.textContent = `${matches.length} of ${state.offences.length} offence rules shown`;
    if(onSelectionChange) onSelectionChange();
  };

  searchInput.addEventListener('input', renderOptions);
  severitySelect.addEventListener('change', renderOptions);
  ruleSelect.addEventListener('change', ()=>{ if(onSelectionChange) onSelectionChange(); });
  renderOptions();
  return ruleSelect;
}

  openModal(`

          <div class="field"><label>Full Name</label><input id="incident-name" readonly/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Designation</label><input id="incident-designation" readonly/></div>
          <div class="field"><label>Division / Line</label><input id="incident-division" readonly/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Agent</label><input id="incident-agent" readonly/></div>
          <div class="field"><label>Status</label><input id="incident-status" readonly/></div>
        </div>
        <div class="field-row" id="incident-worker-details" style="display:none;">
          <div class="field"><label>Passport No.</label><input id="incident-passport" readonly/></div>
          <div class="field"><label>Shift</label><input id="incident-shift" readonly/></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Current Demerit Points</label><input id="incident-current-points" readonly/></div>
          <div class="field"><label>Current Action</label><input id="incident-current-action" readonly/></div>
        </div>
      </div>

      <div class="field">
        <label>Date of Offence</label>
        <input id="incident-date" type="date" value="${todayISODate()}" max="${todayISODate()}"/>
      </div>
      <div class="field">
        <label>Offence Rule</label>
        ${offencePickerControlsHtml('incident-offence')}
        <select id="incident-rule" aria-label="Matching offence rules"></select>
        <div class="offence-picker-count" id="incident-offence-count"></div>
      </div>

      <div class="incident-projection" id="incident-projection"></div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="btn-cancel">Cancel</button>
      <button class="btn primary" id="btn-record-incident" disabled>${ICONS.plus} Record Incident</button>
    </div>
  `, true);

  const groupSelect = document.getElementById('incident-group');
  const personSearch = document.getElementById('incident-person-search');
  const personSelect = document.getElementById('incident-person');
  const personCount = document.getElementById('incident-person-count');
  const ruleSelect = document.getElementById('incident-rule');
  const recordButton = document.getElementById('btn-record-incident');
  let selectedPerson = null;

  const groupRecords = ()=> groupSelect.value==='staff' ? state.staffs : state.workers;
  const selectedRule = ()=> state.offences.find(rule=>rule.id===ruleSelect.value) || null;

  function renderPersonOptions(){
    const allRecords = groupRecords();
    const query = personSearch.value.toLowerCase().trim();
    const previous = personSelect.value;
    const records = allRecords
      .filter(person=>!query || [person.name,person.employeeId,person.division,person.agent,person.designation].join(' ').toLowerCase().includes(query))
      .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    personSelect.innerHTML = `<option value="">${records.length?`Select a ${groupSelect.value} record…`:'No matching names found'}</option>`+
      records.map(person=>`<option value="${esc(person.id)}">${esc(person.employeeId||'No ID')} · ${esc(person.name)}</option>`).join('');
    personSelect.disabled = records.length===0;
    personCount.textContent = `${records.length} of ${allRecords.length} ${groupSelect.value} records shown`;
    if(previous && records.some(person=>person.id===previous)){
      personSelect.value = previous;
      populatePerson();
      return;
    }
    selectedPerson = null;
    document.getElementById('incident-person-card').classList.remove('show');
    updateProjection();
  }

  function populatePerson(){
    selectedPerson = groupRecords().find(person=>person.id===personSelect.value) || null;
    const card = document.getElementById('incident-person-card');
    card.classList.toggle('show', !!selectedPerson);
    if(!selectedPerson){ updateProjection(); return; }

    document.getElementById('incident-empid').value = selectedPerson.employeeId || '';
    document.getElementById('incident-name').value = selectedPerson.name || '';
    document.getElementById('incident-designation').value = selectedPerson.designation || '';
    document.getElementById('incident-division').value = selectedPerson.division || '';
    document.getElementById('incident-agent').value = selectedPerson.agent || '';
    document.getElementById('incident-status').value = selectedPerson.status || 'Active';
    document.getElementById('incident-current-points').value = selectedPerson.demeritPoints || 0;
    document.getElementById('incident-current-action').value = selectedPerson.action || 'No Disciplinary Action';
    const workerDetails = document.getElementById('incident-worker-details');
    workerDetails.style.display = groupSelect.value==='worker' ? '' : 'none';
    document.getElementById('incident-passport').value = selectedPerson.passportNo || '';
    document.getElementById('incident-shift').value = selectedPerson.shift || '';
    updateProjection();
  }

  function updateProjection(){
    const rule = selectedRule();
    const projection = document.getElementById('incident-projection');
    const ready = !!selectedPerson && !!rule;
    recordButton.disabled = !ready;
    projection.classList.toggle('show', ready);
    if(!ready){ projection.innerHTML = ''; return; }

    const updatedPoints = clamp((selectedPerson.demeritPoints||0) + rule.points, 0, 100);
    const tier = tierFor(updatedPoints, groupSelect.value);
    const updatedAction = updatedPoints > 0 && tier ? tier.action : 'No Disciplinary Action';
    projection.innerHTML = `<b style="color:var(--text);">Automatic result</b><br>`+
      `${esc(rule.offence)} adds <b style="color:var(--red);">${rule.points} points</b>. `+
      `Demerit points become <b style="color:var(--text);">${updatedPoints} / 100</b> and the disciplinary action becomes `+
      `<b style="color:var(--amber);">${esc(updatedAction)}</b>.`;
  }

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('btn-cancel').addEventListener('click', closeModal);
  groupSelect.addEventListener('change', renderPersonOptions);
  personSearch.addEventListener('input', renderPersonOptions);
  personSelect.addEventListener('change', populatePerson);
  setupOffencePicker('incident-offence', 'incident-rule', updateProjection);
  renderPersonOptions();

  recordButton.addEventListener('click', ()=>{
    const rule = selectedRule();
    if(!selectedPerson || !rule){ toast('Select a person and offence rule', '', true); return; }
    const dateInput = document.getElementById('incident-date').value || todayISODate();
    const occurredAt = dateInput===todayISODate() ? new Date().toISOString() : new Date(dateInput+'T12:00:00').toISOString();
    selectedPerson.offenceLog = selectedPerson.offenceLog||[];
    selectedPerson.offenceLog.push({
      id:uid('INC'),
      label:`[${rule.severity.replace(' Offence','')}] ${rule.offence}`,
      points:rule.points,
      ruleId:rule.id,
      date:occurredAt,
      by:currentUser()?.username || 'unknown',
      voided:false,
    });
    recalcPointsFromLog(selectedPerson, groupSelect.value);
    selectedPerson.lastModifiedBy = currentUser()?.username || 'unknown';
    selectedPerson.lastModifiedAt = new Date().toISOString();
    queueSave(groupSelect.value==='staff'?'staffs':'workers');
    closeModal();
    renderAll();
    toast('Incident recorded', `${selectedPerson.name} · ${rule.offence} (+${rule.points} pts)`);
  });
}

      const records = isStaff ? state.staffs : state.workers;
      const query = personSearch.value.toLowerCase().trim();
      const matches = records
        .filter(person=>!query || [person.name,person.employeeId,person.division,person.agent,person.designation].join(' ').toLowerCase().includes(query))
        .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
      personSelect.innerHTML = `<option value="">${matches.length?`Select a ${group} record to update…`:'No matching names found'}</option>`+
        matches.map(person=>`<option value="${esc(person.id)}">${esc(person.name)} · ${esc(person.employeeId||'No ID')}${person.id===id?' (current record)':''}</option>`).join('');
      personSelect.disabled = matches.length===0;
      personCount.textContent = `${matches.length} of ${records.length} ${group} records shown`;
    };
    personSearch.addEventListener('input', renderMatchingPeople);
    personSelect.addEventListener('change', ()=>{
      if(personSelect.value && personSelect.value!==id) openPersonModal(personSelect.value, group);
    });
    renderMatchingPeople();
    document.getElementById('btn-del-inline').addEventListener('click', ()=>{ closeModal(); confirmDeletePerson(id, group); });
    document.querySelectorAll('[data-remove-of]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const idx = +b.dataset.removeOf;
        const entry = p.offenceLog[idx];
        if(!entry || entry.voided) return;
        if(!confirm(`Void "${entry.label}" (+${entry.points} pts)? The audit history will be preserved.`)) return;
        entry.voided = true;
        entry.voidedAt = new Date().toISOString();
        entry.voidedBy = currentUser()?.username || 'unknown';
        recalcPointsFromLog(p, group);
        p.lastModifiedBy = currentUser()?.username || 'unknown';
        p.lastModifiedAt = new Date().toISOString();
        queueSave(isStaff?'staffs':'workers');
        openPersonModal(id, group);
        renderPeopleTable(group);
        toast('Offence voided', entry.label);
      });
    });
    const clearHistoryButton = document.getElementById('btn-clear-offence-history');
    if(clearHistoryButton) clearHistoryButton.addEventListener('click', ()=>{
      const entryCount = p.offenceLog.length;
      if(!confirm(`Clear all ${entryCount} offence history entr${entryCount===1?'y':'ies'} for ${p.name}? This resets their demerit points and recommended action. The change remains recorded in the server audit trail.`)) return;
      p.offenceLog = [];
      recalcPointsFromLog(p, group);
      p.lastModifiedBy = currentUser()?.username || 'unknown';
      p.lastModifiedAt = new Date().toISOString();
      queueSave(isStaff?'staffs':'workers');
      renderAll();
      openPersonModal(id, group);
      toast('Offence history cleared', `${p.name} · ${entryCount} entr${entryCount===1?'y':'ies'} removed`);
    });

    const applyOffenceRule = (ruleId)=>{
      if(!ruleId) return;
      const rule = state.offences.find(o=>o.id===ruleId);
      if(!rule) return;
      const dateInput = document.getElementById('f-offence-date').value || todayISODate();
      // Combine the chosen (possibly backdated) date with the current time-of-day for entries
      // logged today, or noon for backdated entries where the exact time isn't known.
      const isToday = dateInput === todayISODate();
      const occurredAt = isToday ? new Date().toISOString() : new Date(dateInput+'T12:00:00').toISOString();
      p.offenceLog.push({
        id: uid('INC'),
        label: `[${rule.severity.replace(' Offence','')}] ${rule.offence}`,
        points: rule.points, ruleId: rule.id,
        date: occurredAt,
        by: currentUser()?.username || 'unknown',
        voided: false,
      });
      recalcPointsFromLog(p, group);
      p.lastModifiedBy = currentUser()?.username || 'unknown';
      p.lastModifiedAt = new Date().toISOString();
      queueSave(isStaff?'staffs':'workers');
      renderPeopleTable(group);
      toast('Offence applied', `${rule.offence} (+${rule.points} pts) — ${p.action}`);
      openPersonModal(id, group);
    };
    setupOffencePicker('edit-offence', 'f-apply-offence');
    // Applies the instant you pick a rule from the filtered dropdown — no extra click needed,
    // and it's saved immediately so nothing is lost if you close the modal.
    document.getElementById('f-apply-offence').addEventListener('change', (e)=>{
      applyOffenceRule(e.target.value);
    });
    document.getElementById('btn-apply-offence').addEventListener('click', ()=>{
      applyOffenceRule(document.getElementById('f-apply-offence').value);
    });
  }

  const saveButton = document.getElementById('btn-save');
  if(saveButton) saveButton.addEventListener('click', ()=>{
    if(!requireAdminAccess()) return;
    const vals = {
      employeeId: document.getElementById('f-empid').value.trim(),
      agent: document.getElementById('f-agent').value.trim(),
      name: document.getElementById('f-name').value.trim(),
      designation: document.getElementById('f-desig').value.trim(),
      division: document.getElementById('f-division').value.trim(),
      status: document.getElementById('f-status').value,
    };
    if(!isStaff){
      vals.passportNo = document.getElementById('f-passport').value.trim();
      vals.shift = document.getElementById('f-shift').value;
    }
    if(!vals.name){ toast('Name is required', '', true); return; }
    if(!vals.employeeId){ toast('Employee ID is required', '', true); return; }
    const targetRecords = isStaff ? state.staffs : state.workers;
    if(targetRecords.some(person=>person.id!==id && String(person.employeeId||'').trim().toLowerCase()===vals.employeeId.toLowerCase())){
      toast('Employee ID must be unique', `${vals.employeeId} already exists in ${group} records.`, true);
      return;
    }

    vals.lastModifiedBy = currentUser()?.username || 'unknown';
    vals.lastModifiedAt = new Date().toISOString();

    if(id){
      Object.assign(p, vals);
      recalcPointsFromLog(p, group);
    } else {
      const newRec = { id: uid(isStaff?'STF':'WKR'), offenceLog: [], demeritPoints:0, totalPoints:100, action:'No Disciplinary Action', ...vals };
      targetRecords.push(newRec);
    }
    queueSave(isStaff?'staffs':'workers');
    closeModal();
    renderAll();
    toast(id? 'Record updated' : 'Record created', vals.name);
  });
}


function confirmDeletePerson(id, group){

  const p = arr.find(x=>x.id===id);

    toast('Record deleted', p.name);
  });
}
